# Staging stack on a single small VM (Oracle E2.1.Micro: 1 GB RAM + swap).
# Images are built by GitHub Actions and pulled from GHCR; nothing is built here.
# Secrets live in deploy/staging/.env on the VM (created by setup-vm.sh).
name: reword-staging

x-api-image: &api-image ${API_IMAGE:-ghcr.io/mirinnano/reword-api:staging}

services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_uca1400_ai_ci
      - --default-time-zone=+00:00
      # Sized for a 1 GB VM. Raise innodb-buffer-pool-size on a bigger host.
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=8M
      - --performance-schema=OFF
      - --max-connections=40
      - --key-buffer-size=8M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?}
      MARIADB_DATABASE: reword
      MARIADB_USER: reword
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?}
    # Loopback only: reachable through `ssh -L` for tests, never from the internet.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    mem_limit: 400m
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  migrate:
    image: *api-image
    entrypoint: ["/usr/local/bin/migrate", "up"]
    environment:
      DATABASE_DSN: reword:${MARIADB_PASSWORD}@tcp(mariadb:3306)/reword
    depends_on:
      mariadb:
        condition: service_healthy

  api:
    image: *api-image
    restart: unless-stopped
    environment:
      APP_ENV: staging
      HTTP_ADDR: :8080
      DATABASE_DSN: reword:${MARIADB_PASSWORD}@tcp(mariadb:3306)/reword
    mem_limit: 128m
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST:?}
      ORIGIN_SECRET: ${ORIGIN_SECRET:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    mem_limit: 96m
    depends_on:
      - api

volumes:
  mariadb-data:
  caddy-data:
