grade: g2
items:
  - key: g2-v-debate
    headword: "debate"
    pos: noun
    meanings_ja: ["討論、ディベート", "論争"]
    example_en: "Our class held a debate on whether school uniforms should be required."
    example_ja: "私たちのクラスで、制服を義務にすべきかどうかについて討論会を開いた。"
  - key: g2-v-inspect
    headword: "inspect"
    pos: verb
    meanings_ja: ["〜を点検する", "〜を検査する、視察する"]
    example_en: "A safety officer came to inspect the machines in our factory last week."
    example_ja: "先週、安全担当の職員が工場の機械を点検しに来た。"
  - key: g2-v-correspond
    headword: "correspond"
    pos: verb
    meanings_ja: ["（〜と）一致する、対応する", "（〜と）文通する"]
    example_en: "The numbers in your report do not correspond with the data in the table."
    example_ja: "あなたの報告書の数字は、表のデータと一致していない。"
  - key: g2-v-enhance
    headword: "enhance"
    pos: verb
    meanings_ja: ["〜を高める、強化する", "〜を向上させる"]
    example_en: "The new software update will enhance the quality of photos taken with this phone."
    example_ja: "新しいソフトウェアの更新で、このスマートフォンで撮る写真の画質が向上する。"
  - key: g2-v-due-to
    headword: "due to"
    pos: phrase
    meanings_ja: ["〜のために、〜が原因で"]
    example_en: "The outdoor concert was canceled due to heavy rain and strong winds."
    example_ja: "大雨と強風のため、野外コンサートは中止になった。"
  - key: g2-v-invest
    headword: "invest"
    pos: verb
    meanings_ja: ["（〜に）投資する", "（時間・労力を）注ぐ"]
    example_en: "The company plans to invest more money in training its young employees."
    example_ja: "その会社は若手社員の研修にもっとお金を投資する予定だ。"
  - key: g2-v-workplace
    headword: "workplace"
    pos: noun
    meanings_ja: ["職場"]
    example_en: "Our workplace became much quieter after the new rules about phone calls."
    example_ja: "電話に関する新しい規則ができてから、私たちの職場はずっと静かになった。"
  - key: g2-v-renovate
    headword: "renovate"
    pos: verb
    meanings_ja: ["（建物などを）改装する、修復する"]
    example_en: "My parents decided to renovate the old kitchen before my grandmother moved in."
    example_ja: "祖母が引っ越してくる前に、両親は古い台所を改装することにした。"
  - key: g2-v-resort
    headword: "resort"
    pos: noun
    meanings_ja: ["行楽地、リゾート", "（最後の）手段"]
    example_en: "We stayed at a beach resort in Okinawa during the summer vacation."
    example_ja: "夏休みに、私たちは沖縄の海辺のリゾートに泊まった。"
  - key: g2-v-specifically
    headword: "specifically"
    pos: adverb
    meanings_ja: ["特に、とりわけ", "具体的に、明確に"]
    example_en: "The teacher specifically asked us to check our spelling before handing in the essay."
    example_ja: "先生は、作文を提出する前につづりを確認するよう特に念を押した。"
  - key: g2-v-vague
    headword: "vague"
    pos: adjective
    meanings_ja: ["あいまいな、漠然とした", "（形などが）ぼんやりした"]
    example_en: "His answer was so vague that nobody understood what he really wanted."
    example_ja: "彼の答えはあまりにあいまいで、本当は何を望んでいるのか誰にも分からなかった。"
  - key: g2-v-sensible
    headword: "sensible"
    pos: adjective
    meanings_ja: ["分別のある、賢明な", "（服などが）実用的な"]
    example_en: "It would be sensible to bring an umbrella because it might rain later."
    example_ja: "後で雨が降るかもしれないので、傘を持っていくのが賢明だろう。"
  - key: g2-v-density
    headword: "density"
    pos: noun
    meanings_ja: ["密度", "（人口の）密集度"]
    example_en: "Tokyo has one of the highest population densities of any city in the world."
    example_ja: "東京は世界でも人口密度が最も高い都市の一つだ。"
  - key: g2-v-voluntary
    headword: "voluntary"
    pos: adjective
    meanings_ja: ["自発的な、任意の", "ボランティアの、無償の"]
    example_en: "Joining the beach cleanup is voluntary, but many students take part every year."
    example_ja: "海岸清掃への参加は任意だが、毎年多くの生徒が参加している。"
  - key: g2-v-journey
    headword: "journey"
    pos: noun
    meanings_ja: ["（長い）旅行、旅", "道のり"]
    example_en: "The train journey from Tokyo to Osaka takes about two and a half hours."
    example_ja: "東京から大阪までの列車の旅は、約2時間半かかる。"
  - key: g2-v-innovative
    headword: "innovative"
    pos: adjective
    meanings_ja: ["革新的な、斬新な"]
    example_en: "The young engineers came up with an innovative way to recycle plastic bottles."
    example_ja: "若い技術者たちは、ペットボトルをリサイクルする革新的な方法を考え出した。"
  - key: g2-v-bury
    headword: "bury"
    pos: verb
    meanings_ja: ["〜を埋める", "〜を埋葬する"]
    example_en: "Our dog likes to bury its toys in the garden and dig them up later."
    example_ja: "うちの犬は、おもちゃを庭に埋めて後で掘り出すのが好きだ。"
  - key: g2-v-function
    headword: "function"
    pos: noun
    meanings_ja: ["機能、働き", "（公式の）行事、式典"]
    example_en: "This camera has a function that removes blur from photos automatically."
    example_ja: "このカメラには、写真のぶれを自動で補正する機能がある。"
  - key: g2-v-legalize
    headword: "legalize"
    pos: verb
    meanings_ja: ["〜を合法化する"]
    example_en: "Some countries have voted to legalize same-sex marriage in recent years."
    example_ja: "近年、同性婚を合法化することを投票で決めた国がいくつかある。"
  - key: g2-v-suitable
    headword: "suitable"
    pos: adjective
    meanings_ja: ["（〜に）適した、ふさわしい"]
    example_en: "This apartment is not suitable for a family with three small children."
    example_ja: "このアパートは、小さな子どもが3人いる家族には向いていない。"
  - key: g2-v-movement
    headword: "movement"
    pos: noun
    meanings_ja: ["（社会的・政治的な）運動", "動き、動作"]
    example_en: "The movement to protect women's rights grew quickly in the early twentieth century."
    example_ja: "20世紀初め、女性の権利を守る運動は急速に広がった。"
  - key: g2-v-set-up
    headword: "set up"
    pos: phrase
    meanings_ja: ["〜を設立する、立ち上げる", "〜を設置する、準備する"]
    example_en: "After working at a bank for ten years, she set up her own business."
    example_ja: "銀行で10年働いた後、彼女は自分の会社を立ち上げた。"
  - key: g2-v-household
    headword: "household"
    pos: noun
    meanings_ja: ["世帯、家族", "家庭"]
    example_en: "Most households in this town have at least one car."
    example_ja: "この町のほとんどの世帯は、少なくとも1台は車を持っている。"
  - key: g2-v-regulate
    headword: "regulate"
    pos: verb
    meanings_ja: ["〜を規制する、取り締まる", "〜を調節する"]
    example_en: "The government plans to regulate the use of drones near airports."
    example_ja: "政府は空港周辺でのドローンの使用を規制する予定だ。"
  - key: g2-v-anticipate
    headword: "anticipate"
    pos: verb
    meanings_ja: ["〜を予想する、予期する", "〜に前もって備える"]
    example_en: "We did not anticipate so many customers on the first day of the sale."
    example_ja: "セールの初日に、こんなに多くの客が来るとは予想していなかった。"
  - key: g2-v-authorize
    headword: "authorize"
    pos: verb
    meanings_ja: ["〜を認可する、許可する", "（to do で）〜する権限を与える"]
    example_en: "Only the manager can authorize refunds of more than ten thousand yen."
    example_ja: "1万円を超える返金を許可できるのは店長だけだ。"
  - key: g2-v-secure
    headword: "secure"
    pos: adjective
    meanings_ja: ["安全な、守られた", "安定した、確かな"]
    example_en: "Please keep your passwords in a secure place where others cannot see them."
    example_ja: "パスワードは、他人に見られない安全な場所に保管してください。"
  - key: g2-v-discrimination
    headword: "discrimination"
    pos: noun
    meanings_ja: ["差別"]
    example_en: "The new law makes discrimination against workers because of their age illegal."
    example_ja: "新しい法律で、年齢を理由に労働者を差別することは違法になる。"
  - key: g2-v-carbon
    headword: "carbon"
    pos: noun
    meanings_ja: ["炭素", "（carbon dioxide で）二酸化炭素"]
    example_en: "Trees take in carbon from the air and store it in their wood."
    example_ja: "木は空気中の炭素を取り込み、幹の中に蓄える。"
  - key: g2-v-fortunately
    headword: "fortunately"
    pos: adverb
    meanings_ja: ["幸運にも、幸いにも"]
    example_en: "I left my wallet on the train, but fortunately someone handed it in."
    example_ja: "電車に財布を忘れたが、幸いにも誰かが届けてくれた。"
  - key: g2-v-scratch
    headword: "scratch"
    pos: verb
    meanings_ja: ["〜をかく", "〜に引っかき傷をつける"]
    example_en: "Try not to scratch your mosquito bites, or they will get worse."
    example_ja: "蚊に刺されたところはかかないようにしなさい。ひどくなるから。"
  - key: g2-v-firm
    headword: "firm"
    pos: noun
    meanings_ja: ["会社、事務所"]
    example_en: "My sister works for a law firm in the center of Osaka."
    example_ja: "姉は大阪の中心部にある法律事務所で働いている。"
  - key: g2-v-nevertheless
    headword: "nevertheless"
    pos: adverb
    meanings_ja: ["それにもかかわらず、それでも"]
    example_en: "The road was covered in snow. Nevertheless, the bus arrived on time."
    example_ja: "道は雪で覆われていた。それでも、バスは時間通りに到着した。"
  - key: g2-v-prosper
    headword: "prosper"
    pos: verb
    meanings_ja: ["繁栄する、栄える", "成功する"]
    example_en: "The small fishing town prospered after the new port was built."
    example_ja: "新しい港ができてから、その小さな漁師町は栄えた。"
  - key: g2-v-float
    headword: "float"
    pos: verb
    meanings_ja: ["浮く、浮かぶ", "漂う"]
    example_en: "We watched the leaves float slowly down the river."
    example_ja: "私たちは木の葉がゆっくりと川を流れていくのを眺めた。"
  - key: g2-v-investment
    headword: "investment"
    pos: noun
    meanings_ja: ["投資", "（時間・労力などを）つぎ込むこと"]
    example_en: "Buying a good pair of shoes for work is a wise investment."
    example_ja: "仕事用に良い靴を買うのは、賢いお金の使い方だ。"
  - key: g2-v-broad
    headword: "broad"
    pos: adjective
    meanings_ja: ["幅の広い", "（範囲が）広い、幅広い"]
    example_en: "This bookstore offers a broad range of books, from comics to science."
    example_ja: "この書店には、漫画から科学書まで幅広い本がそろっている。"
  - key: g2-v-insult
    headword: "insult"
    pos: verb
    meanings_ja: ["〜を侮辱する"]
    example_en: "He felt insulted when his boss called his idea childish in the meeting."
    example_ja: "会議で上司に自分の案を子どもっぽいと言われ、彼は侮辱されたと感じた。"
  - key: g2-v-extreme
    headword: "extreme"
    pos: adjective
    meanings_ja: ["極端な", "極度の、非常に激しい"]
    example_en: "Some areas of the country experienced extreme heat this summer."
    example_ja: "今年の夏、国内のいくつかの地域は猛暑に見舞われた。"
  - key: g2-v-separate
    headword: "separate"
    pos: verb
    meanings_ja: ["〜を分ける、分離する", "（〜と）別れる、離れる"]
    example_en: "Please separate the cans from the plastic bottles before you put out the trash."
    example_ja: "ごみを出す前に、缶とペットボトルを分けてください。"
  - key: g2-v-flavor
    headword: "flavor"
    pos: noun
    meanings_ja: ["風味、味"]
    example_en: "Which ice cream flavor do you like best, vanilla or chocolate?"
    example_ja: "アイスクリームはバニラとチョコレートのどちらの味がいちばん好きですか。"
  - key: g2-v-network
    headword: "network"
    pos: noun
    meanings_ja: ["ネットワーク、網状の組織", "人脈"]
    example_en: "The city has a good network of buses, so you don't need a car."
    example_ja: "その市はバス網が充実しているので、車は必要ない。"
  - key: g2-v-fill-in
    headword: "fill in"
    pos: phrase
    meanings_ja: ["（用紙などに）記入する", "（for で）〜の代わりを務める"]
    example_en: "Please fill in this form with your name and address."
    example_ja: "この用紙に名前と住所を記入してください。"
  - key: g2-v-otherwise
    headword: "otherwise"
    pos: adverb
    meanings_ja: ["さもないと、そうでなければ", "その他の点では"]
    example_en: "Leave home now; otherwise you will miss the last train."
    example_ja: "もう家を出なさい。さもないと終電に乗り遅れますよ。"
  - key: g2-v-credit
    headword: "credit"
    pos: noun
    meanings_ja: ["信用貸し、クレジット", "称賛、功績"]
    example_en: "Many young people buy things on credit without thinking about how to pay later."
    example_ja: "多くの若者が、後でどう払うかを考えずにクレジットで物を買う。"
  - key: g2-v-electronic
    headword: "electronic"
    pos: adjective
    meanings_ja: ["電子の、電子工学の"]
    example_en: "Students may not use electronic dictionaries during the English test."
    example_ja: "英語のテスト中、生徒は電子辞書を使ってはいけない。"
  - key: g2-v-produce
    headword: "produce"
    pos: verb
    meanings_ja: ["〜を生産する、製造する", "〜を生み出す"]
    example_en: "This farm produces about two tons of rice every year."
    example_ja: "この農場では毎年約2トンの米を生産している。"
  - key: g2-v-sort-out
    headword: "sort out"
    pos: phrase
    meanings_ja: ["〜を解決する", "〜を整理する、分類する"]
    example_en: "The two friends talked for an hour and finally sorted out their problem."
    example_ja: "二人の友人は1時間話し合って、ようやく問題を解決した。"
  - key: g2-v-logic
    headword: "logic"
    pos: noun
    meanings_ja: ["論理、論法", "筋道"]
    example_en: "I can't follow the logic of your argument; please explain it again."
    example_ja: "あなたの主張の論理についていけないので、もう一度説明してください。"
  - key: g2-v-homeless
    headword: "homeless"
    pos: adjective
    meanings_ja: ["家のない、ホームレスの"]
    example_en: "Volunteers serve hot meals to homeless people in the park every winter."
    example_ja: "毎年冬になると、ボランティアが公園でホームレスの人々に温かい食事を配る。"
  - key: g2-v-immigration
    headword: "immigration"
    pos: noun
    meanings_ja: ["（外国からの）移住、移民", "出入国管理"]
    example_en: "Immigration has made the population of the city much more diverse."
    example_ja: "移民が増えたことで、その都市の人口構成はずっと多様になった。"
  - key: g2-v-shiver
    headword: "shiver"
    pos: verb
    meanings_ja: ["（寒さ・恐怖で）震える"]
    example_en: "The children were shivering after playing in the cold sea for an hour."
    example_ja: "冷たい海で1時間遊んだ後、子どもたちは震えていた。"
  - key: g2-v-suit
    headword: "suit"
    pos: verb
    meanings_ja: ["〜に似合う", "〜に都合がよい、適する"]
    example_en: "That blue jacket really suits you, so you should wear it more often."
    example_ja: "その青いジャケット、本当によく似合っているから、もっと着たらいいよ。"
  - key: g2-v-get-through
    headword: "get through"
    pos: phrase
    meanings_ja: ["〜を切り抜ける、乗り越える", "（電話が）つながる"]
    example_en: "Thanks to my friends' support, I got through a difficult first year at college."
    example_ja: "友人たちの支えのおかげで、私は大学の苦しい1年目を乗り切った。"
  - key: g2-v-obey
    headword: "obey"
    pos: verb
    meanings_ja: ["〜に従う、服従する"]
    example_en: "All drivers must obey the speed limit, especially near schools."
    example_ja: "すべてのドライバーは、特に学校の近くでは制限速度を守らなければならない。"
  - key: g2-v-analyze
    headword: "analyze"
    pos: verb
    meanings_ja: ["〜を分析する"]
    example_en: "Scientists analyzed the water samples to see if they were safe to drink."
    example_ja: "科学者たちは、飲んでも安全かどうかを調べるために水のサンプルを分析した。"
  - key: g2-v-harm
    headword: "harm"
    pos: verb
    meanings_ja: ["〜を傷つける、害する"]
    example_en: "Too much sunlight can harm your skin, so wear sunscreen."
    example_ja: "日光を浴びすぎると肌を傷めることがあるので、日焼け止めを塗りなさい。"
  - key: g2-v-dive
    headword: "dive"
    pos: verb
    meanings_ja: ["（水に）飛び込む", "潜る"]
    example_en: "The boy dove into the pool to pick up the coin at the bottom."
    example_ja: "男の子は底にある硬貨を拾おうと、プールに飛び込んだ。"
  - key: g2-v-agenda
    headword: "agenda"
    pos: noun
    meanings_ja: ["（会議の）議題、議事日程", "（政治上の）課題"]
    example_en: "The first item on today's agenda is the budget for the school festival."
    example_ja: "今日の議題の最初は、文化祭の予算についてだ。"
  - key: g2-v-realistic
    headword: "realistic"
    pos: adjective
    meanings_ja: ["現実的な", "写実的な、本物そっくりの"]
    example_en: "Losing ten kilograms in one month is not a realistic goal."
    example_ja: "1か月で10キロやせるのは現実的な目標ではない。"
  - key: g2-v-slip
    headword: "slip"
    pos: verb
    meanings_ja: ["滑る、滑って転ぶ", "そっと動く、こっそり入る（出る）"]
    example_en: "Be careful not to slip on the wet floor near the entrance."
    example_ja: "入り口付近のぬれた床で滑らないよう気をつけて。"
  - key: g2-v-illness
    headword: "illness"
    pos: noun
    meanings_ja: ["病気"]
    example_en: "My grandfather recovered from a serious illness and is now walking every day."
    example_ja: "祖父は重い病気から回復し、今では毎日散歩をしている。"
  - key: g2-v-remain
    headword: "remain"
    pos: verb
    meanings_ja: ["〜のままである", "残る、とどまる"]
    example_en: "Please remain seated until the plane has come to a complete stop."
    example_ja: "飛行機が完全に停止するまで、座ったままでお待ちください。"
  - key: g2-v-draw-up
    headword: "draw up"
    pos: phrase
    meanings_ja: ["（計画・文書などを）作成する"]
    example_en: "The committee drew up a plan to reduce waste in the school cafeteria."
    example_ja: "委員会は学食のごみを減らす計画を作成した。"
  - key: g2-v-dine
    headword: "dine"
    pos: verb
    meanings_ja: ["食事をする、（特に）夕食をとる"]
    example_en: "We dined at a small Italian restaurant to celebrate our anniversary."
    example_ja: "私たちは記念日を祝って、小さなイタリア料理店で夕食をとった。"
  - key: g2-v-tremble
    headword: "tremble"
    pos: verb
    meanings_ja: ["（体・声などが）震える"]
    example_en: "Her hands trembled as she opened the letter from the university."
    example_ja: "大学からの手紙を開けるとき、彼女の手は震えた。"
  - key: g2-v-flood
    headword: "flood"
    pos: verb
    meanings_ja: ["〜を水浸しにする、（川などが）氾濫する", "（人・物が）殺到する"]
    example_en: "The heavy rain flooded several streets near the river last night."
    example_ja: "昨夜の大雨で、川沿いのいくつかの通りが冠水した。"
  - key: g2-v-temperature
    headword: "temperature"
    pos: noun
    meanings_ja: ["温度、気温", "体温、熱"]
    example_en: "The temperature dropped below zero, and the lake began to freeze."
    example_ja: "気温が氷点下まで下がり、湖が凍り始めた。"
  - key: g2-v-hypothesis
    headword: "hypothesis"
    pos: noun
    meanings_ja: ["仮説"]
    example_en: "Our hypothesis was that plants grow faster when they listen to music."
    example_ja: "私たちの仮説は、植物は音楽を聞かせると速く育つというものだった。"
  - key: g2-v-take-on
    headword: "take on"
    pos: phrase
    meanings_ja: ["（仕事・責任などを）引き受ける", "（人を）雇う"]
