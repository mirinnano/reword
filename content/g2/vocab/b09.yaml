# 2級 単語（オリジナル例文）バッチ09
grade: g2
items:
  - key: g2-v-informal
    headword: informal
    pos: adjective
    meanings_ja: ["形式ばらない、くだけた", "非公式の"]
    example_en: "You can wear informal clothes to the party; jeans and a T-shirt are fine."
    example_ja: "パーティーにはくだけた服装で来てかまいません。ジーンズとTシャツで大丈夫です。"
  - key: g2-v-institution
    headword: institution
    pos: noun
    meanings_ja: ["（大学・病院などの）機関、施設", "制度、慣習"]
    example_en: "Universities and hospitals are important institutions in every large city."
    example_ja: "大学や病院は、どの大都市にとっても重要な機関だ。"
  - key: g2-v-review
    headword: review
    pos: verb
    meanings_ja: ["〜を復習する", "〜を見直す、検討する", "〜を批評する"]
    example_en: "I reviewed my notes from class the night before the math test."
    example_ja: "数学のテストの前の晩に、授業のノートを復習した。"
  - key: g2-v-poverty
    headword: poverty
    pos: noun
    meanings_ja: ["貧困、貧乏"]
    example_en: "Many families in the area still live in poverty and cannot afford enough food."
    example_ja: "その地域では今も多くの家庭が貧困の中で暮らし、十分な食料を買えない。"
  - key: g2-v-put-forward
    headword: put forward
    pos: phrase
    meanings_ja: ["（案・意見などを）提案する、出す"]
    example_en: "At the meeting, Ken put forward a plan to reduce overtime work."
    example_ja: "会議で、ケンは残業を減らす案を出した。"
  - key: g2-v-link
    headword: link
    pos: verb
    meanings_ja: ["〜をつなぐ、結びつける", "（〜を…と）関連づける"]
    example_en: "You can link your smartphone to the car's speakers with Bluetooth."
    example_ja: "Bluetoothを使えば、スマートフォンを車のスピーカーにつなげることができる。"
  - key: g2-v-renewable
    headword: renewable
    pos: adjective
    meanings_ja: ["（エネルギー資源が）再生可能な", "更新できる"]
    example_en: "Solar and wind power are renewable sources of energy that will not run out."
    example_ja: "太陽光や風力は、なくなることのない再生可能なエネルギー源だ。"
  - key: g2-v-quote
    headword: quote
    pos: verb
    meanings_ja: ["〜を引用する", "（価格などを）見積もる"]
    example_en: "In her essay, Mika quoted a famous scientist to support her opinion."
    example_ja: "ミカは自分の意見を裏付けるため、作文の中で有名な科学者の言葉を引用した。"
  - key: g2-v-gender
    headword: gender
    pos: noun
    meanings_ja: ["（社会的・文化的な）性、性別"]
    example_en: "The company says it pays workers the same, regardless of their gender."
    example_ja: "その会社は、性別に関係なく従業員に同じ給料を払っていると言っている。"
  - key: g2-v-categorize
    headword: categorize
    pos: verb
    meanings_ja: ["〜を分類する"]
    example_en: "The students categorized the insects they found by the number of legs."
    example_ja: "生徒たちは見つけた虫を脚の数で分類した。"
  - key: g2-v-resist
    headword: resist
    pos: verb
    meanings_ja: ["〜に抵抗する、反対する", "（誘惑などを）こらえる"]
    example_en: "Some workers resisted the new rules because they were not asked for their opinions."
    example_ja: "意見を求められなかったので、新しい規則に反対する従業員もいた。"
  - key: g2-v-sample
    headword: sample
    pos: noun
    meanings_ja: ["見本、試供品", "（調査用の）標本、サンプル"]
    example_en: "The scientist took a sample of water from the river to check for pollution."
    example_ja: "その科学者は汚染を調べるため、川の水のサンプルを採取した。"
  - key: g2-v-rural
    headword: rural
    pos: adjective
    meanings_ja: ["田舎の、農村の"]
    example_en: "My grandparents live in a rural area where there are more cows than people."
    example_ja: "祖父母は人より牛のほうが多いような田舎に住んでいる。"
  - key: g2-v-adjust
    headword: adjust
    pos: verb
    meanings_ja: ["〜を調節する、調整する", "（〜に）慣れる、順応する"]
    example_en: "You can adjust the height of this chair by pulling the lever."
    example_ja: "このいすは、レバーを引くと高さを調節できる。"
  - key: g2-v-sustainable
    headword: sustainable
    pos: adjective
    meanings_ja: ["（環境を壊さずに）持続可能な", "維持できる"]
    example_en: "The town is trying to build a sustainable future by recycling more waste."
    example_ja: "その町は、ごみのリサイクルを増やして持続可能な未来を築こうとしている。"
  - key: g2-v-renew
    headword: renew
    pos: verb
    meanings_ja: ["〜を更新する", "〜を再開する、新しくする"]
    example_en: "I need to renew my passport before my trip to Canada next month."
    example_ja: "来月のカナダ旅行の前に、パスポートを更新しなければならない。"
  - key: g2-v-receipt
    headword: receipt
    pos: noun
    meanings_ja: ["領収書、レシート", "受け取ること、受領"]
    example_en: "Please keep the receipt in case you want to return the shoes."
    example_ja: "靴を返品する場合に備えて、レシートを保管しておいてください。"
  - key: g2-v-prompt
    headword: prompt
    pos: verb
    meanings_ja: ["〜を促す、（to do で）…するよう促す", "〜を引き起こす"]
    example_en: "The heavy rain prompted the school to cancel the sports day."
    example_ja: "大雨のため、学校は運動会を中止することにした。"
  - key: g2-v-original
    headword: original
    pos: adjective
    meanings_ja: ["最初の、元の", "独創的な"]
    example_en: "The original plan was to meet at noon, but we changed it to two o'clock."
    example_ja: "最初の予定では正午に会うことになっていたが、2時に変更した。"
  - key: g2-v-native
    headword: native
    pos: adjective
    meanings_ja: ["生まれ故郷の、母国の", "（動植物が）その土地固有の"]
    example_en: "Maria's native language is Spanish, but she also speaks English and Japanese."
    example_ja: "マリアの母語はスペイン語だが、英語と日本語も話す。"
  - key: g2-v-slight
    headword: slight
    pos: adjective
    meanings_ja: ["わずかな、少しの"]
    example_en: "There was a slight change in the train schedule this morning."
    example_ja: "今朝、電車の時刻表にわずかな変更があった。"
  - key: g2-v-sketch
    headword: sketch
    pos: verb
    meanings_ja: ["〜をスケッチする、略図を描く", "〜の概略を述べる"]
    example_en: "During the field trip, we sketched the old temple in our notebooks."
    example_ja: "校外学習の間、私たちはノートにその古い寺をスケッチした。"
  - key: g2-v-remind
    headword: remind
    pos: verb
    meanings_ja: ["（人に）思い出させる、（of で）〜を思い出させる", "（to do で）…することを気づかせる"]
    example_en: "Please remind me to call the dentist tomorrow morning."
    example_ja: "明日の朝、歯医者に電話するのを忘れないよう、私に声をかけてください。"
  - key: g2-v-allergy
    headword: allergy
    pos: noun
    meanings_ja: ["アレルギー"]
    example_en: "My brother has an allergy to eggs, so he cannot eat most cakes."
    example_ja: "弟は卵アレルギーなので、ほとんどのケーキが食べられない。"
  - key: g2-v-structure
    headword: structure
    pos: noun
    meanings_ja: ["構造、仕組み", "建造物"]
    example_en: "The teacher explained the structure of the human heart using a model."
    example_ja: "先生は模型を使って人間の心臓の構造を説明した。"
  - key: g2-v-ambitious
    headword: ambitious
    pos: adjective
    meanings_ja: ["野心的な、大志を抱いた", "（計画などが）大がかりな"]
    example_en: "She is an ambitious student who hopes to start her own company someday."
    example_ja: "彼女はいつか自分の会社を起こしたいと思っている、大志を抱いた生徒だ。"
  - key: g2-v-scenery
    headword: scenery
    pos: noun
    meanings_ja: ["景色、風景"]
    example_en: "We stopped the car several times to enjoy the beautiful mountain scenery."
    example_ja: "私たちは美しい山の景色を楽しむため、何度も車を止めた。"
  - key: g2-v-pose
    headword: pose
    pos: verb
    meanings_ja: ["（問題・危険などを）引き起こす、もたらす", "ポーズをとる"]
    example_en: "Plastic waste in the ocean poses a serious threat to sea animals."
    example_ja: "海のプラスチックごみは、海の生き物にとって深刻な脅威となっている。"
  - key: g2-v-architecture
    headword: architecture
    pos: noun
    meanings_ja: ["建築様式", "建築（学）"]
    example_en: "Many tourists visit Kyoto to see its traditional architecture."
    example_ja: "多くの観光客が伝統的な建築を見に京都を訪れる。"
  - key: g2-v-peaceful
    headword: peaceful
    pos: adjective
    meanings_ja: ["平和な", "穏やかな、静かな"]
    example_en: "We spent a peaceful afternoon reading books by the lake."
    example_ja: "私たちは湖のほとりで本を読んで、穏やかな午後を過ごした。"
  - key: g2-v-crime
    headword: crime
    pos: noun
    meanings_ja: ["犯罪、罪"]
    example_en: "The police say crime in the city has decreased since more cameras were installed."
    example_ja: "警察によると、防犯カメラが増えてから市内の犯罪は減っている。"
  - key: g2-v-depart
    headword: depart
    pos: verb
    meanings_ja: ["出発する"]
    example_en: "The flight to Sapporo will depart from Gate 12 at 3:15."
    example_ja: "札幌行きの便は3時15分に12番ゲートから出発する。"
  - key: g2-v-desire
    headword: desire
    pos: verb
    meanings_ja: ["〜を強く望む、欲する"]
    example_en: "Most people desire a job that is both interesting and well paid."
    example_ja: "たいていの人は、おもしろくて給料もよい仕事を望んでいる。"
  - key: g2-v-passive
    headword: passive
    pos: adjective
    meanings_ja: ["受け身の、消極的な"]
    example_en: "Instead of being passive in class, try to ask the teacher questions."
    example_ja: "授業では受け身にならず、先生に質問するようにしなさい。"
  - key: g2-v-artistic
    headword: artistic
    pos: adjective
    meanings_ja: ["芸術的な", "芸術の才能がある"]
    example_en: "My sister is very artistic and designs all of her own birthday cards."
    example_ja: "姉は芸術の才能があり、誕生日カードもすべて自分でデザインしている。"
  - key: g2-v-inevitable
    headword: inevitable
    pos: adjective
    meanings_ja: ["避けられない、必然的な"]
    example_en: "With so many cars on the road, traffic jams during holidays are inevitable."
    example_ja: "道路にこれだけ車が多いと、休日の渋滞は避けられない。"
  - key: g2-v-range
    headword: range
    pos: verb
    meanings_ja: ["（from A to B で）（範囲が）AからBに及ぶ"]
    example_en: "Ticket prices range from 1,000 to 5,000 yen depending on the seat."
    example_ja: "チケットの値段は、席によって1,000円から5,000円までさまざまだ。"
  - key: g2-v-stare
    headword: stare
    pos: verb
    meanings_ja: ["（at で）〜をじっと見つめる"]
    example_en: "The little boy stared at the elephant for a long time without saying a word."
    example_ja: "その男の子は一言も話さず、長い間ゾウをじっと見つめていた。"
  - key: g2-v-frequently
    headword: frequently
    pos: adverb
    meanings_ja: ["たびたび、頻繁に"]
    example_en: "This bus is frequently late during the morning rush hour."
    example_ja: "このバスは朝のラッシュ時にたびたび遅れる。"
  - key: g2-v-tolerate
    headword: tolerate
    pos: verb
    meanings_ja: ["〜を我慢する、許容する"]
    example_en: "Our teacher will not tolerate cheating on tests."
    example_ja: "私たちの先生はテストでのカンニングを許さない。"
  - key: g2-v-prescribe
    headword: prescribe
    pos: verb
    meanings_ja: ["（薬を）処方する", "〜を規定する"]
    example_en: "The doctor prescribed some medicine for my cough."
    example_ja: "医者はせきの薬を処方してくれた。"
  - key: g2-v-outstanding
    headword: outstanding
    pos: adjective
    meanings_ja: ["目立った、傑出した", "未払いの、未解決の"]
    example_en: "Kenta received a prize for his outstanding performance in the speech contest."
    example_ja: "ケンタはスピーチコンテストでの優れた発表で賞をもらった。"
  - key: g2-v-politician
    headword: politician
    pos: noun
    meanings_ja: ["政治家"]
    example_en: "The politician promised to build more nursery schools if she was elected."
    example_ja: "その政治家は、当選したら保育園を増やすと約束した。"
  - key: g2-v-corporate
    headword: corporate
    pos: adjective
    meanings_ja: ["企業の、会社の"]
    example_en: "The bank's corporate office is in Tokyo, but it has branches across Japan."
    example_ja: "その銀行は本社が東京にあり、全国に支店がある。"
  - key: g2-v-sort
    headword: sort
    pos: verb
    meanings_ja: ["〜を分類する、仕分けする"]
    example_en: "Please sort the trash into burnable and non-burnable items."
    example_ja: "ごみを燃えるものと燃えないものに分別してください。"
  - key: g2-v-treatment
    headword: treatment
    pos: noun
    meanings_ja: ["治療", "扱い、待遇"]
    example_en: "After a week of treatment at the hospital, his condition improved."
    example_ja: "病院で1週間治療を受けて、彼の容体はよくなった。"
  - key: g2-v-implement
    headword: implement
    pos: verb
    meanings_ja: ["（計画・政策などを）実行する、実施する"]
    example_en: "The school will implement a new uniform policy starting next April."
    example_ja: "学校は来年4月から新しい制服の方針を実施する。"
  - key: g2-v-automation
    headword: automation
    pos: noun
    meanings_ja: ["自動化、オートメーション"]
    example_en: "Automation has allowed the factory to produce twice as many cars."
    example_ja: "自動化によって、その工場は2倍の数の車を生産できるようになった。"
  - key: g2-v-infectious
    headword: infectious
    pos: adjective
    meanings_ja: ["（病気が）感染性の、伝染性の", "（笑いなどが）うつりやすい"]
    example_en: "Flu is an infectious disease, so stay home if you have a fever."
    example_ja: "インフルエンザは感染症なので、熱があるときは家にいてください。"
  - key: g2-v-assignment
    headword: assignment
    pos: noun
    meanings_ja: ["宿題、課題", "（仕事の）割り当て"]
    example_en: "Our history assignment is to write a report about a famous castle."
    example_ja: "歴史の課題は、有名な城についてレポートを書くことだ。"
  - key: g2-v-shake
    headword: shake
    pos: verb
    meanings_ja: ["〜を振る、揺する", "揺れる、震える"]
    example_en: "Shake the bottle well before you pour the dressing on the salad."
    example_ja: "サラダにドレッシングをかける前に、瓶をよく振ってください。"
  - key: g2-v-factor
    headword: factor
    pos: noun
    meanings_ja: ["要因、要素"]
    example_en: "Price is an important factor when people choose a new smartphone."
    example_ja: "新しいスマートフォンを選ぶとき、値段は重要な要素だ。"
  - key: g2-v-remarkable
    headword: remarkable
    pos: adjective
    meanings_ja: ["注目すべき、驚くべき"]
    example_en: "The new medicine has had remarkable results in treating the disease."
    example_ja: "その新薬はその病気の治療で目覚ましい成果をあげている。"
  - key: g2-v-deliver
    headword: deliver
    pos: verb
    meanings_ja: ["〜を配達する、届ける", "（演説などを）する"]
    example_en: "The online store promised to deliver the package by Friday."
    example_ja: "そのネットショップは金曜日までに荷物を届けると約束した。"
  - key: g2-v-emit
    headword: emit
    pos: verb
    meanings_ja: ["（光・熱・ガスなどを）放出する、出す"]
    example_en: "Old cars emit more harmful gases than newer electric ones."
    example_ja: "古い車は新しい電気自動車よりも多くの有害なガスを出す。"
  - key: g2-v-take-up
    headword: take up
    pos: phrase
    meanings_ja: ["（趣味などを）始める", "（時間・場所を）とる"]
    example_en: "My father took up jogging last year to improve his health."
    example_ja: "父は健康のために昨年ジョギングを始めた。"
  - key: g2-v-opposite
    headword: opposite
    pos: adjective
    meanings_ja: ["反対の、逆の", "向かい側の"]
    example_en: "The two brothers have opposite opinions about almost everything."
    example_ja: "その兄弟は、ほとんどすべてのことについて正反対の意見を持っている。"
  - key: g2-v-reproduce
    headword: reproduce
    pos: verb
    meanings_ja: ["〜を複製する、再現する", "繁殖する"]
    example_en: "Scientists tried to reproduce the results of the experiment in their own lab."
    example_ja: "科学者たちは自分たちの研究室でその実験の結果を再現しようとした。"
  - key: g2-v-crash
    headword: crash
    pos: verb
    meanings_ja: ["衝突する、墜落する", "（コンピューターが）故障して動かなくなる"]
    example_en: "My computer crashed while I was writing my report, and I lost an hour of work."
    example_ja: "レポートを書いている途中でパソコンが動かなくなり、1時間分の作業が消えてしまった。"
  - key: g2-v-immense
    headword: immense
    pos: adjective
    meanings_ja: ["巨大な、莫大な"]
    example_en: "Building the new stadium will cost an immense amount of money."
    example_ja: "新しい競技場の建設には莫大な費用がかかるだろう。"
  - key: g2-v-govern
    headword: govern
    pos: verb
    meanings_ja: ["〜を治める、統治する", "〜を左右する"]
    example_en: "The country has been governed by the same party for over twenty years."
    example_ja: "その国は20年以上、同じ政党によって治められている。"
  - key: g2-v-responsible
    headword: responsible
    pos: adjective
    meanings_ja: ["（for で）〜に責任がある、〜を担当している", "信頼できる"]
    example_en: "Mr. Sato is responsible for planning the school festival this year."
    example_ja: "今年は佐藤先生が文化祭の計画を担当している。"
  - key: g2-v-campaign
    headword: campaign
    pos: noun
    meanings_ja: ["（社会的・政治的な）運動、キャンペーン", "選挙運動"]
    example_en: "The city started a campaign to encourage people to ride bicycles to work."
    example_ja: "市は自転車通勤を勧めるキャンペーンを始めた。"
  - key: g2-v-role
    headword: role
    pos: noun
    meanings_ja: ["役割", "（劇の）役"]
    example_en: "Parents play an important role in their children's education."
    example_ja: "親は子どもの教育で重要な役割を果たしている。"
  - key: g2-v-out-of-date
    headword: out of date
    pos: phrase
    meanings_ja: ["時代遅れの、古くなった", "期限切れの"]
    example_en: "This map is out of date, so it doesn't show the new highway."
    example_ja: "この地図は古いので、新しい高速道路が載っていない。"
  - key: g2-v-in-favor-of
    headword: in favor of
    pos: phrase
    meanings_ja: ["〜に賛成して", "〜のほうを選んで"]
    example_en: "Most of the students were in favor of having a longer summer vacation."
    example_ja: "生徒のほとんどが、夏休みを長くすることに賛成だった。"
  - key: g2-v-respond
    headword: respond
    pos: verb
    meanings_ja: ["（to で）〜に答える、返事をする", "〜に反応する"]
    example_en: "I sent her an e-mail last week, but she hasn't responded yet."
    example_ja: "先週彼女にメールを送ったが、まだ返事がない。"
  - key: g2-v-investor
    headword: investor
    pos: noun
    meanings_ja: ["投資家、出資者"]
    example_en: "The young company is looking for investors to help it grow."
    example_ja: "その新しい会社は、成長を支えてくれる投資家を探している。"
  - key: g2-v-technical
    headword: technical
    pos: adjective
    meanings_ja: ["技術的な", "専門的な"]
    example_en: "The concert was delayed for thirty minutes because of a technical problem."
    example_ja: "技術的な問題のため、コンサートは30分遅れて始まった。"
  - key: g2-v-significant
    headword: significant
    pos: adjective
    meanings_ja: ["重要な、意義のある", "（数量が）かなりの"]
    example_en: "There has been a significant increase in the number of foreign tourists."
    example_ja: "外国人観光客の数がかなり増えている。"
  - key: g2-v-mental
    headword: mental
    pos: adjective
    meanings_ja: ["精神の、心の"]
    example_en: "Getting enough sleep is important for both your physical and mental health."
    example_ja: "十分な睡眠は、体と心の両方の健康にとって大切だ。"
  - key: g2-v-violent
    headword: violent
    pos: adjective
