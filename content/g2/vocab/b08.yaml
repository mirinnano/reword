grade: g2
items:
  - key: g2-v-come-down-with
    headword: come down with
    pos: phrase
    meanings_ja: ["（病気）にかかる"]
    example_en: "My brother came down with a cold just before his school trip."
    example_ja: "弟は修学旅行の直前に風邪をひいた。"
  - key: g2-v-specialize
    headword: specialize
    pos: verb
    meanings_ja: ["（in で）〜を専門にする", "〜を専攻する"]
    example_en: "She plans to specialize in child psychology at graduate school."
    example_ja: "彼女は大学院で児童心理学を専攻するつもりだ。"
  - key: g2-v-posture
    headword: posture
    pos: noun
    meanings_ja: ["姿勢"]
    example_en: "Sitting with good posture at your desk can help prevent back pain."
    example_ja: "机に向かうときに良い姿勢で座ると、腰痛を防ぎやすくなる。"
  - key: g2-v-visual
    headword: visual
    pos: adjective
    meanings_ja: ["視覚の", "視覚的な"]
    example_en: "The teacher used visual aids such as photos and charts to explain the topic."
    example_ja: "先生は写真や図表などの視覚教材を使って、その話題を説明した。"
  - key: g2-v-alternative
    headword: alternative
    pos: adjective
    meanings_ja: ["代わりの", "代替の"]
    example_en: "The city is looking for alternative energy sources to replace coal."
    example_ja: "市は石炭に代わるエネルギー源を探している。"
  - key: g2-v-manual
    headword: manual
    pos: adjective
    meanings_ja: ["手を使う", "手動の"]
    example_en: "Many factory jobs that once required manual labor are now done by robots."
    example_ja: "かつて手作業が必要だった工場の仕事の多くは、今ではロボットが行っている。"
  - key: g2-v-accessible
    headword: accessible
    pos: adjective
    meanings_ja: ["（場所・情報などが）利用しやすい", "近づきやすい"]
    example_en: "The new website is accessible to people who cannot see well."
    example_ja: "新しいウェブサイトは、目の不自由な人にも利用しやすい。"
  - key: g2-v-brilliant
    headword: brilliant
    pos: adjective
    meanings_ja: ["非常に優れた", "見事な"]
    example_en: "Ken had a brilliant idea for our class presentation."
    example_ja: "ケンはクラスの発表について、すばらしいアイデアを思いついた。"
  - key: g2-v-territory
    headword: territory
    pos: noun
    meanings_ja: ["領土", "地域"]
    example_en: "Visitors need special permission to enter this territory."
    example_ja: "この地域に入るには、訪問者は特別な許可が必要だ。"
  - key: g2-v-association
    headword: association
    pos: noun
    meanings_ja: ["協会", "団体"]
    example_en: "My father joined a local business association to meet other shop owners."
    example_ja: "父は他の店主と知り合うために、地元の商業協会に入った。"
  - key: g2-v-intellectual
    headword: intellectual
    pos: adjective
    meanings_ja: ["知的な", "知性の"]
    example_en: "Chess is an intellectual game that requires careful thinking and planning."
    example_ja: "チェスは、注意深い思考と計画が必要な知的なゲームだ。"
  - key: g2-v-on-average
    headword: on average
    pos: phrase
    meanings_ja: ["平均して"]
    example_en: "On average, students in this school spend two hours a day on homework."
    example_ja: "この学校の生徒は、平均して1日に2時間宿題をする。"
  - key: g2-v-historical
    headword: historical
    pos: adjective
    meanings_ja: ["歴史の", "歴史上の"]
    example_en: "Kyoto has many historical buildings that attract tourists from abroad."
    example_ja: "京都には、海外からの観光客を引きつける歴史的な建物がたくさんある。"
  - key: g2-v-tie
    headword: tie
    pos: verb
    meanings_ja: ["〜を結ぶ", "〜を縛る"]
    example_en: "Please tie your shoelaces before you start running."
    example_ja: "走り始める前に靴ひもを結びなさい。"
  - key: g2-v-livestock
    headword: livestock
    pos: noun
    meanings_ja: ["家畜"]
    example_en: "The drought made it hard for farmers to feed their livestock."
    example_ja: "干ばつのせいで、農家は家畜にえさを与えるのが難しくなった。"
  - key: g2-v-cell
    headword: cell
    pos: noun
    meanings_ja: ["細胞"]
    example_en: "In biology class, we looked at plant cells under a microscope."
    example_ja: "生物の授業で、私たちは顕微鏡で植物の細胞を観察した。"
  - key: g2-v-accent
    headword: accent
    pos: noun
    meanings_ja: ["なまり", "アクセント"]
    example_en: "He speaks English with a slight French accent."
    example_ja: "彼は少しフランス語なまりのある英語を話す。"
  - key: g2-v-global
    headword: global
    pos: adjective
    meanings_ja: ["世界的な", "地球規模の"]
    example_en: "Climate change is a global problem that no country can solve alone."
    example_ja: "気候変動は、一国だけでは解決できない地球規模の問題だ。"
  - key: g2-v-elementary
    headword: elementary
    pos: adjective
    meanings_ja: ["初歩の", "基本的な"]
    example_en: "This textbook is for learners with only an elementary knowledge of Spanish."
    example_ja: "この教科書は、スペイン語の初歩的な知識しかない学習者向けだ。"
  - key: g2-v-software
    headword: software
    pos: noun
    meanings_ja: ["ソフトウェア"]
    example_en: "You need to update the software on your computer to use this app."
    example_ja: "このアプリを使うには、コンピューターのソフトウェアを更新する必要がある。"
  - key: g2-v-track
    headword: track
    pos: verb
    meanings_ja: ["〜の跡を追う", "〜を追跡する"]
    example_en: "This app lets you track your package until it arrives at your door."
    example_ja: "このアプリを使えば、荷物が届くまでその配送状況を追跡できる。"
  - key: g2-v-agency
    headword: agency
    pos: noun
    meanings_ja: ["代理店", "（政府の）機関"]
    example_en: "We booked our trip to Hawaii through a travel agency."
    example_ja: "私たちは旅行代理店を通してハワイ旅行を予約した。"
  - key: g2-v-furniture
    headword: furniture
    pos: noun
    meanings_ja: ["家具"]
    example_en: "We bought some new furniture for our living room, including a sofa."
    example_ja: "私たちはリビング用に、ソファなど新しい家具をいくつか買った。"
  - key: g2-v-yawn
    headword: yawn
    pos: verb
    meanings_ja: ["あくびをする"]
    example_en: "Several students yawned during the long lecture after lunch."
    example_ja: "昼食後の長い講義の間、何人かの生徒があくびをした。"
  - key: g2-v-identity
    headword: identity
    pos: noun
    meanings_ja: ["身元", "正体", "アイデンティティ"]
    example_en: "You must show a passport or driver's license to prove your identity."
    example_ja: "身元を証明するために、パスポートか運転免許証を見せなければならない。"
  - key: g2-v-immune
    headword: immune
    pos: adjective
    meanings_ja: ["免疫のある", "（to で）〜に影響されない"]
    example_en: "After having the illness once, most people become immune to it."
    example_ja: "一度その病気にかかると、ほとんどの人は免疫ができる。"
  - key: g2-v-smash
    headword: smash
    pos: verb
    meanings_ja: ["〜を粉々に壊す", "〜を打ち砕く"]
    example_en: "The ball flew over the fence and smashed a neighbor's window."
    example_ja: "ボールがフェンスを越えて、隣の家の窓を割った。"
  - key: g2-v-display
    headword: display
    pos: verb
    meanings_ja: ["〜を展示する", "〜を表示する"]
    example_en: "The museum displays paintings by local artists every spring."
    example_ja: "その美術館では、毎年春に地元の画家の絵を展示している。"
  - key: g2-v-cut-down-on
    headword: cut down on
    pos: phrase
    meanings_ja: ["〜を減らす"]
    example_en: "My doctor told me to cut down on salt and sugar."
    example_ja: "医者に塩分と砂糖を控えるように言われた。"
  - key: g2-v-internal
    headword: internal
    pos: adjective
    meanings_ja: ["内部の", "国内の"]
    example_en: "The company is holding an internal meeting to discuss the new rules."
    example_ja: "その会社は新しい規則について話し合うため、社内会議を開いている。"
  - key: g2-v-drought
    headword: drought
    pos: noun
    meanings_ja: ["干ばつ"]
    example_en: "The long drought this summer has damaged many crops."
    example_ja: "この夏の長い干ばつで、多くの作物が被害を受けた。"
  - key: g2-v-cautious
    headword: cautious
    pos: adjective
    meanings_ja: ["用心深い", "慎重な"]
    example_en: "Be cautious when you give personal information to websites you don't know."
    example_ja: "知らないウェブサイトに個人情報を伝えるときは、用心しなさい。"
  - key: g2-v-custom
    headword: custom
    pos: noun
    meanings_ja: ["慣習", "風習"]
    example_en: "In Japan, it is a custom to take off your shoes before entering a house."
    example_ja: "日本では、家に入る前に靴を脱ぐのが習慣だ。"
  - key: g2-v-stain
    headword: stain
    pos: verb
    meanings_ja: ["〜にしみをつける", "〜を汚す"]
    example_en: "I accidentally stained my white shirt with coffee this morning."
    example_ja: "今朝、うっかり白いシャツにコーヒーのしみをつけてしまった。"
  - key: g2-v-yield
    headword: yield
    pos: verb
    meanings_ja: ["〜を産出する", "（結果など）をもたらす"]
    example_en: "These fields yield a large amount of rice every year."
    example_ja: "これらの田んぼでは毎年たくさんの米がとれる。"
  - key: g2-v-graduate
    headword: graduate
    pos: verb
    meanings_ja: ["（from で）〜を卒業する"]
    example_en: "My sister graduated from university last March and now works at a bank."
    example_ja: "姉は去年の3月に大学を卒業して、今は銀行で働いている。"
  - key: g2-v-virtually
    headword: virtually
    pos: adverb
    meanings_ja: ["事実上", "ほとんど"]
    example_en: "Virtually every student in my class has a smartphone."
    example_ja: "私のクラスでは、ほとんど全員の生徒がスマートフォンを持っている。"
  - key: g2-v-constant
    headword: constant
    pos: adjective
    meanings_ja: ["絶え間ない", "一定の"]
    example_en: "The constant noise from the construction site made it hard to study."
    example_ja: "工事現場から絶えず騒音がしていたので、勉強しにくかった。"
  - key: g2-v-digitize
    headword: digitize
    pos: verb
    meanings_ja: ["〜をデジタル化する"]
    example_en: "The library is digitizing old newspapers so people can read them online."
    example_ja: "その図書館は、人々がオンラインで読めるように古い新聞をデジタル化している。"
  - key: g2-v-suffer
    headword: suffer
    pos: verb
    meanings_ja: ["（from で）〜に苦しむ", "（損害など）を受ける"]
    example_en: "Many people suffer from hay fever in spring."
    example_ja: "春には多くの人が花粉症に苦しむ。"
  - key: g2-v-compose
    headword: compose
    pos: verb
    meanings_ja: ["（曲・文）を作る", "〜を構成する"]
    example_en: "Mozart composed his first piece of music when he was only five."
    example_ja: "モーツァルトは、わずか5歳で最初の曲を作った。"
  - key: g2-v-depend
    headword: depend
    pos: verb
    meanings_ja: ["（on で）〜に頼る", "〜次第である"]
    example_en: "Whether we go hiking tomorrow depends on the weather."
    example_ja: "明日ハイキングに行くかどうかは天気次第だ。"
  - key: g2-v-criminal
    headword: criminal
    pos: noun
    meanings_ja: ["犯罪者"]
    example_en: "The police finally caught the criminal who had robbed the bank."
    example_ja: "警察は銀行強盗をした犯人をついに逮捕した。"
  - key: g2-v-visa
    headword: visa
    pos: noun
    meanings_ja: ["ビザ", "査証"]
    example_en: "You need a student visa to study in that country for a year."
    example_ja: "その国で1年間勉強するには、学生ビザが必要だ。"
  - key: g2-v-include
    headword: include
    pos: verb
    meanings_ja: ["〜を含む"]
    example_en: "The price of the hotel room includes breakfast."
    example_ja: "そのホテルの宿泊料金には朝食が含まれている。"
  - key: g2-v-rapid
    headword: rapid
    pos: adjective
    meanings_ja: ["急速な", "速い"]
    example_en: "The rapid growth of online shopping has changed how people buy things."
    example_ja: "ネット通販が急速に広まったことで、人々の買い物の仕方は変わった。"
  - key: g2-v-meanwhile
    headword: meanwhile
    pos: adverb
    meanings_ja: ["その間に", "一方では"]
    example_en: "Dad was cooking dinner. Meanwhile, I set the table."
    example_ja: "父が夕食を作っていた。その間に、私は食卓の準備をした。"
  - key: g2-v-trap
    headword: trap
    pos: verb
    meanings_ja: ["〜を閉じ込める", "〜をわなで捕らえる"]
    example_en: "Dozens of people were trapped in the elevator during the power outage."
    example_ja: "停電の間、何十人もの人がエレベーターに閉じ込められた。"
  - key: g2-v-corporation
    headword: corporation
    pos: noun
    meanings_ja: ["（大）企業", "法人"]
    example_en: "He works for a large corporation that makes cars and motorcycles."
    example_ja: "彼は車とオートバイを製造する大企業に勤めている。"
  - key: g2-v-cancer
    headword: cancer
    pos: noun
    meanings_ja: ["がん"]
    example_en: "Smoking greatly increases the risk of lung cancer."
    example_ja: "喫煙は肺がんになる危険性を大きく高める。"
  - key: g2-v-loyal
    headword: loyal
    pos: adjective
    meanings_ja: ["忠実な", "誠実な"]
    example_en: "The store gives discounts to loyal customers who shop there often."
    example_ja: "その店は、よく買い物に来るお得意様に割引をしている。"
  - key: g2-v-responsibility
    headword: responsibility
    pos: noun
    meanings_ja: ["責任", "義務"]
    example_en: "Taking care of the class rabbit is our responsibility this week."
    example_ja: "今週は、クラスのウサギの世話をするのが私たちの役目だ。"
  - key: g2-v-alert
    headword: alert
    pos: adjective
    meanings_ja: ["油断のない", "注意を怠らない"]
    example_en: "Drivers must stay alert, especially when driving at night."
    example_ja: "運転する人は、特に夜間は注意を怠ってはならない。"
  - key: g2-v-discourage
    headword: discourage
    pos: verb
    meanings_ja: ["〜のやる気をなくさせる", "（from doing で）〜するのを思いとどまらせる"]
    example_en: "High prices discourage many young people from buying houses."
    example_ja: "価格が高いため、多くの若者が家を買うのをあきらめている。"
  - key: g2-v-literally
    headword: literally
    pos: adverb
    meanings_ja: ["文字どおり", "本当に"]
    example_en: "The singer was so popular that the concert sold out literally in minutes."
    example_ja: "その歌手はとても人気があり、コンサートは文字どおり数分で売り切れた。"
  - key: g2-v-mention
    headword: mention
    pos: verb
    meanings_ja: ["〜に言及する", "〜のことを言う"]
    example_en: "She didn't mention that she was moving to Osaka next month."
    example_ja: "彼女は来月大阪に引っ越すことを話さなかった。"
  - key: g2-v-acquaintance
    headword: acquaintance
    pos: noun
    meanings_ja: ["知り合い", "知人"]
    example_en: "He is not a close friend, just an acquaintance from work."
    example_ja: "彼は親しい友人ではなく、ただの仕事上の知り合いだ。"
  - key: g2-v-innovation
    headword: innovation
    pos: noun
    meanings_ja: ["革新", "新しい工夫"]
    example_en: "Innovation in battery technology has made electric cars cheaper."
    example_ja: "電池技術の革新によって、電気自動車は安くなった。"
  - key: g2-v-tap
    headword: tap
    pos: verb
    meanings_ja: ["〜を軽くたたく"]
    example_en: "Tap the screen twice to open the photo."
    example_ja: "画面を2回軽くたたくと写真が開く。"
  - key: g2-v-care-for
    headword: care for
    pos: phrase
    meanings_ja: ["〜の世話をする", "（否定・疑問文で）〜を好む"]
    example_en: "She cared for her grandmother after she broke her leg."
    example_ja: "祖母が脚を骨折したあと、彼女は祖母の世話をした。"
  - key: g2-v-put-out
    headword: put out
    pos: phrase
    meanings_ja: ["（火・明かり）を消す"]
    example_en: "The firefighters put out the fire in less than an hour."
    example_ja: "消防士たちは1時間足らずで火を消し止めた。"
  - key: g2-v-recycle
    headword: recycle
    pos: verb
    meanings_ja: ["〜を再利用する", "リサイクルする"]
    example_en: "Our school recycles paper, cans, and plastic bottles."
    example_ja: "私たちの学校では、紙と缶とペットボトルをリサイクルしている。"
  - key: g2-v-landfill
    headword: landfill
    pos: noun
    meanings_ja: ["ごみの埋め立て地"]
    example_en: "Much of our household waste ends up in a landfill."
    example_ja: "家庭ごみの多くは、最後には埋め立て地に運ばれる。"
  - key: g2-v-fossil
    headword: fossil
    pos: noun
    meanings_ja: ["化石"]
    example_en: "The children found a fossil of a small fish near the river."
    example_ja: "子どもたちは川の近くで小さな魚の化石を見つけた。"
  - key: g2-v-admire
    headword: admire
    pos: verb
    meanings_ja: ["〜を称賛する", "〜に感心する"]
    example_en: "I really admire my coach for her hard work and patience."
    example_ja: "努力家で忍耐強いコーチを、私は心から尊敬している。"
  - key: g2-v-goods
    headword: goods
    pos: noun
    meanings_ja: ["商品", "品物"]
    example_en: "The store sells sports goods such as shoes, balls, and rackets."
    example_ja: "その店では靴やボール、ラケットなどのスポーツ用品を売っている。"
  - key: g2-v-shift
    headword: shift
    pos: verb
    meanings_ja: ["〜を移す", "（方針などを）変える"]
    example_en: "Many companies have shifted their focus to online sales."
    example_ja: "多くの会社が、オンライン販売に重点を移している。"
  - key: g2-v-make-a-difference
    headword: make a difference
    pos: phrase
    meanings_ja: ["違いを生む", "影響を与える"]
    example_en: "Even small actions like turning off lights can make a difference."
    example_ja: "明かりを消すといった小さな行動でも、変化をもたらすことができる。"
  - key: g2-v-sink
    headword: sink
    pos: verb
    meanings_ja: ["沈む", "〜を沈める"]
    example_en: "The old fishing boat sank during the storm last night."
    example_ja: "その古い漁船は、昨夜の嵐で沈んだ。"
  - key: g2-v-supervisor
    headword: supervisor
    pos: noun
    meanings_ja: ["監督者", "上司"]
    example_en: "I asked my supervisor if I could leave work early on Friday."
    example_ja: "金曜日に早退してもいいか、上司に尋ねた。"
  - key: g2-v-assist
    headword: assist
    pos: verb
    meanings_ja: ["〜を手伝う", "〜を援助する"]
    example_en: "Volunteers assisted elderly people at the station during the festival."
    example_ja: "祭りの間、ボランティアが駅でお年寄りの手助けをした。"
  - key: g2-v-achievement
    headword: achievement
    pos: noun
    meanings_ja: ["達成", "業績"]
    example_en: "Winning the national contest was a great achievement for our small club."
    example_ja: "全国大会での優勝は、私たちの小さな部にとって大きな成果だった。"
  - key: g2-v-authority
    headword: authority
    pos: noun
    meanings_ja: ["権威", "権限", "（the authorities で）当局"]
    example_en: "Only the manager has the authority to approve refunds."
    example_ja: "返金を認める権限があるのは店長だけだ。"
  - key: g2-v-reflect
    headword: reflect
    pos: verb
    meanings_ja: ["〜を反射する", "〜を反映する"]
    example_en: "The lake was so calm that it reflected the mountains like a mirror."
    example_ja: "湖はとても穏やかで、鏡のように山々を映していた。"
  - key: g2-v-capacity
    headword: capacity
    pos: noun
    meanings_ja: ["収容能力", "容量", "能力"]
    example_en: "The new stadium has a capacity of 40,000 people."
    example_ja: "新しいスタジアムは4万人を収容できる。"
  - key: g2-v-bring-about
    headword: bring about
    pos: phrase
    meanings_ja: ["〜を引き起こす", "〜をもたらす"]
    example_en: "The internet has brought about huge changes in the way we communicate."
    example_ja: "インターネットによって、私たちのコミュニケーションの方法は大きく変わった。"
  - key: g2-v-somewhat
    headword: somewhat
    pos: adverb
    meanings_ja: ["いくぶん", "やや"]
    example_en: "The test was somewhat easier than I had expected."
    example_ja: "テストは思っていたよりもいくぶん易しかった。"
