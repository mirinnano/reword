# 2級 単語（オリジナル例文） batch 10
grade: g2
items:
  - key: g2-v-craft
    headword: "craft"
    pos: noun
    meanings_ja: ["工芸、工芸品", "技術、技能"]
    example_en: "My grandmother sells traditional crafts such as baskets and wooden toys at the market."
    example_ja: "祖母は市場で、かごや木のおもちゃなどの伝統工芸品を売っている。"
  - key: g2-v-vivid
    headword: "vivid"
    pos: adjective
    meanings_ja: ["（記憶・描写などが）鮮明な、生き生きとした", "（色が）鮮やかな"]
    example_en: "I still have vivid memories of my first trip to Kyoto with my class."
    example_ja: "クラスで初めて京都に行ったときのことを、今でも鮮明に覚えている。"
  - key: g2-v-satellite
    headword: "satellite"
    pos: noun
    meanings_ja: ["（人工）衛星"]
    example_en: "Weather forecasts use pictures taken by satellites that move around the earth."
    example_ja: "天気予報には、地球の周りを回る衛星が撮影した画像が使われている。"
  - key: g2-v-differ
    headword: "differ"
    pos: verb
    meanings_ja: ["（〜と）異なる、違う", "（意見が）食い違う"]
    example_en: "Customs at the dinner table differ greatly from one country to another."
    example_ja: "食事のマナーは国によって大きく異なる。"
  - key: g2-v-court
    headword: "court"
    pos: noun
    meanings_ja: ["法廷、裁判所", "（テニスなどの）コート"]
    example_en: "The man had to appear in court after he was accused of stealing a car."
    example_ja: "その男は車を盗んだ罪に問われ、出廷しなければならなかった。"
  - key: g2-v-vital
    headword: "vital"
    pos: adjective
    meanings_ja: ["（〜にとって）極めて重要な、不可欠な", "生命の、生命維持に必要な"]
    example_en: "Drinking enough water is vital for staying healthy during the hot summer."
    example_ja: "暑い夏に健康を保つには、十分に水を飲むことが欠かせない。"
  - key: g2-v-leisure
    headword: "leisure"
    pos: noun
    meanings_ja: ["余暇、暇", "（形容詞的に）レジャーの"]
    example_en: "My father spends most of his leisure time fishing at the lake."
    example_ja: "父は余暇のほとんどを湖での釣りに費やしている。"
  - key: g2-v-pay-attention-to
    headword: "pay attention to"
    pos: phrase
    meanings_ja: ["〜に注意を払う、〜に注目する"]
    example_en: "Please pay attention to the teacher when she explains the rules of the test."
    example_ja: "先生がテストのルールを説明するときは、よく聞いていてください。"
  - key: g2-v-illustrate
    headword: "illustrate"
    pos: verb
    meanings_ja: ["（例・図などで）説明する、示す", "（本などに）挿絵を入れる"]
    example_en: "The teacher used a simple graph to illustrate how prices had risen."
    example_ja: "先生は簡単なグラフを使って、物価がどのように上がったかを説明した。"
  - key: g2-v-rent
    headword: "rent"
    pos: verb
    meanings_ja: ["（料金を払って）借りる", "（料金を取って）貸す"]
    example_en: "We rented a small car to drive around the island during our vacation."
    example_ja: "私たちは休暇中に島を回るため、小さな車を借りた。"
  - key: g2-v-break-into
    headword: "break into"
    pos: phrase
    meanings_ja: ["〜に押し入る、侵入する", "急に〜し始める"]
    example_en: "Someone broke into the shop last night and took all the cash."
    example_ja: "昨夜、何者かがその店に押し入り、現金をすべて奪った。"
  - key: g2-v-greenhouse
    headword: "greenhouse"
    pos: noun
    meanings_ja: ["温室"]
    example_en: "The farmers grow tomatoes in a greenhouse so they can harvest them in winter."
    example_ja: "農家の人たちは、冬にも収穫できるよう温室でトマトを育てている。"
  - key: g2-v-inventory
    headword: "inventory"
    pos: noun
    meanings_ja: ["在庫（品）", "（在庫などの）一覧表、目録"]
    example_en: "The store checks its inventory every month to see which items are running low."
    example_ja: "その店は毎月在庫を確認し、どの商品が少なくなっているかを調べている。"
  - key: g2-v-vaccinate
    headword: "vaccinate"
    pos: verb
    meanings_ja: ["〜に予防接種をする、ワクチンを接種する"]
    example_en: "All the children at the school were vaccinated against the flu last fall."
    example_ja: "昨年の秋、その学校の子どもたちは全員インフルエンザの予防接種を受けた。"
  - key: g2-v-convey
    headword: "convey"
    pos: verb
    meanings_ja: ["（考え・感情などを）伝える", "運ぶ、運搬する"]
    example_en: "It is hard to convey your feelings in a short text message."
    example_ja: "短いメッセージで自分の気持ちを伝えるのは難しい。"
  - key: g2-v-discount
    headword: "discount"
    pos: noun
    meanings_ja: ["割引、値引き"]
    example_en: "Students can get a ten percent discount on train tickets with their ID card."
    example_ja: "学生は学生証を見せると、電車の切符が10パーセント割引になる。"
  - key: g2-v-sigh
    headword: "sigh"
    pos: verb
    meanings_ja: ["ため息をつく"]
    example_en: "She sighed when she saw the long line in front of the ticket office."
    example_ja: "切符売り場の前の長い行列を見て、彼女はため息をついた。"
  - key: g2-v-measure
    headword: "measure"
    pos: verb
    meanings_ja: ["〜を測る、計る", "（長さ・重さなどが）〜ある"]
    example_en: "The nurse measured my height and weight before the doctor saw me."
    example_ja: "医師の診察の前に、看護師が私の身長と体重を測った。"
  - key: g2-v-automatic
    headword: "automatic"
    pos: adjective
    meanings_ja: ["自動の、自動的な", "無意識の"]
    example_en: "The store has automatic doors that open when a customer walks toward them."
    example_ja: "その店には、客が近づくと開く自動ドアがある。"
  - key: g2-v-breed
    headword: "breed"
    pos: verb
    meanings_ja: ["（動物を）飼育する、繁殖させる", "（動物が）子を産む、繁殖する"]
    example_en: "My uncle breeds horses on his farm and sells them to riding schools."
    example_ja: "おじは牧場で馬を育て、乗馬学校に売っている。"
  - key: g2-v-inflate
    headword: "inflate"
    pos: verb
    meanings_ja: ["（空気などで）膨らませる", "（価格などを）つり上げる"]
    example_en: "Before the game, we had to inflate the soccer balls with a pump."
    example_ja: "試合の前に、私たちはポンプでサッカーボールに空気を入れなければならなかった。"
  - key: g2-v-translation
    headword: "translation"
    pos: noun
    meanings_ja: ["翻訳、訳"]
    example_en: "I read the novel in a Japanese translation because the original was too difficult."
    example_ja: "原書は難しすぎたので、その小説は日本語訳で読んだ。"
  - key: g2-v-ideal
    headword: "ideal"
    pos: adjective
    meanings_ja: ["理想的な、申し分ない"]
    example_en: "This quiet park is an ideal place for reading on a sunny afternoon."
    example_ja: "この静かな公園は、晴れた午後に読書をするのに理想的な場所だ。"
  - key: g2-v-correct
    headword: "correct"
    pos: verb
    meanings_ja: ["〜を訂正する、直す"]
    example_en: "My English teacher corrected the grammar mistakes in my essay."
    example_ja: "英語の先生が、私の作文の文法の誤りを直してくれた。"
  - key: g2-v-soil
    headword: "soil"
    pos: noun
    meanings_ja: ["土、土壌"]
    example_en: "These vegetables grow best in soft soil that holds plenty of water."
    example_ja: "これらの野菜は、水分を十分に含んだ柔らかい土で最もよく育つ。"
  - key: g2-v-faculty
    headword: "faculty"
    pos: noun
    meanings_ja: ["（大学の）学部", "（集合的に）教員", "（心身の）能力"]
    example_en: "My sister is studying in the Faculty of Law at a university in Tokyo."
    example_ja: "姉は東京の大学の法学部で学んでいる。"
  - key: g2-v-democracy
    headword: "democracy"
    pos: noun
    meanings_ja: ["民主主義", "民主国家"]
    example_en: "In a democracy, people choose their leaders by voting in elections."
    example_ja: "民主主義では、人々は選挙で投票して指導者を選ぶ。"
  - key: g2-v-advanced
    headword: "advanced"
    pos: adjective
    meanings_ja: ["（技術などが）進んだ、先進的な", "上級の"]
    example_en: "She joined the advanced English class after passing the placement test."
    example_ja: "クラス分けテストに合格して、彼女は英語の上級クラスに入った。"
  - key: g2-v-primarily
    headword: "primarily"
    pos: adverb
    meanings_ja: ["主に、第一に"]
    example_en: "This website is designed primarily for high school students preparing for exams."
    example_ja: "このウェブサイトは、主に受験勉強をする高校生向けに作られている。"
  - key: g2-v-instrument
    headword: "instrument"
    pos: noun
    meanings_ja: ["楽器", "器具、道具"]
    example_en: "Can you play any musical instruments, like the piano or the guitar?"
    example_ja: "ピアノやギターなど、何か楽器は弾けますか。"
  - key: g2-v-monitor
    headword: "monitor"
    pos: verb
    meanings_ja: ["〜を監視する、観察する"]
    example_en: "Doctors monitored the patient's heart rate closely after the operation."
    example_ja: "手術の後、医師たちは患者の心拍数を注意深く見守った。"
  - key: g2-v-pour
    headword: "pour"
    pos: verb
    meanings_ja: ["〜を注ぐ", "（雨が）激しく降る"]
    example_en: "He poured hot water into the cup and waited three minutes for the tea."
    example_ja: "彼はカップにお湯を注ぎ、お茶ができるまで3分待った。"
  - key: g2-v-positive
    headword: "positive"
    pos: adjective
    meanings_ja: ["前向きな、肯定的な", "確信して", "（検査結果が）陽性の"]
    example_en: "Try to stay positive even if you do not do well on the first test."
    example_ja: "最初のテストでうまくいかなくても、前向きでいるようにしなさい。"
  - key: g2-v-climate
    headword: "climate"
    pos: noun
    meanings_ja: ["気候", "（社会の）風潮"]
    example_en: "Many people move to this town because of its mild climate in winter."
    example_ja: "冬の気候が穏やかなので、多くの人がこの町に移り住んでいる。"
  - key: g2-v-strengthen
    headword: "strengthen"
    pos: verb
    meanings_ja: ["〜を強化する、強くする"]
    example_en: "The coach told us to do push-ups every day to strengthen our arms."
    example_ja: "コーチは、腕を鍛えるために毎日腕立て伏せをするように私たちに言った。"
  - key: g2-v-promote
    headword: "promote"
    pos: verb
    meanings_ja: ["〜を促進する、宣伝する", "（受身で）昇進する"]
    example_en: "The city held a festival to promote local food and attract tourists."
    example_ja: "市は地元の食べ物を宣伝し、観光客を呼び込むために祭りを開いた。"
  - key: g2-v-environmental
    headword: "environmental"
    pos: adjective
    meanings_ja: ["環境の、環境に関する"]
    example_en: "Our school club studies environmental problems such as plastic waste in the ocean."
    example_ja: "私たちの学校のクラブでは、海のプラスチックごみなどの環境問題を研究している。"
  - key: g2-v-significantly
    headword: "significantly"
    pos: adverb
    meanings_ja: ["大幅に、著しく"]
    example_en: "The number of visitors to the museum increased significantly after the new exhibit opened."
    example_ja: "新しい展示が始まってから、博物館の来館者数は大幅に増えた。"
  - key: g2-v-chronic
    headword: "chronic"
    pos: adjective
    meanings_ja: ["（病気が）慢性の", "（問題などが）長期にわたる"]
    example_en: "My grandfather has suffered from chronic back pain for many years."
    example_ja: "祖父は長年、慢性の腰痛に悩まされている。"
  - key: g2-v-symbol
    headword: "symbol"
    pos: noun
    meanings_ja: ["象徴、シンボル", "記号"]
    example_en: "The dove is often used as a symbol of peace."
    example_ja: "ハトは平和の象徴としてよく使われる。"
  - key: g2-v-relative
    headword: "relative"
    pos: noun
    meanings_ja: ["親戚、親類"]
    example_en: "During the New Year holidays, we visit our relatives in the countryside."
    example_ja: "正月休みには、田舎の親戚を訪ねる。"
  - key: g2-v-labor
    headword: "labor"
    pos: noun
    meanings_ja: ["労働", "（集合的に）労働者、労働力"]
    example_en: "Building the bridge by hand required a lot of hard labor."
    example_ja: "その橋を手作業で造るには、多くのきつい労働が必要だった。"
  - key: g2-v-largely
    headword: "largely"
    pos: adverb
    meanings_ja: ["主に、大部分は"]
    example_en: "The success of the event was largely due to the help of local volunteers."
    example_ja: "そのイベントが成功したのは、主に地元のボランティアの協力のおかげだった。"
  - key: g2-v-indeed
    headword: "indeed"
    pos: adverb
    meanings_ja: ["実際に、本当に", "（強調して）確かに"]
    example_en: "The test was indeed difficult, and only a few students passed it."
    example_ja: "そのテストは実際に難しく、合格した生徒はわずかだった。"
  - key: g2-v-regret
    headword: "regret"
    pos: verb
    meanings_ja: ["〜を後悔する", "（〜を）残念に思う"]
    example_en: "I regret not studying harder when I was in high school."
    example_ja: "高校生のときにもっと勉強しなかったことを後悔している。"
  - key: g2-v-escape
    headword: "escape"
    pos: verb
    meanings_ja: ["（〜から）逃げる、脱出する", "〜を免れる"]
    example_en: "Everyone escaped from the building safely before the fire spread."
    example_ja: "火が広がる前に、全員が建物から無事に逃げ出した。"
  - key: g2-v-prejudice
    headword: "prejudice"
    pos: noun
    meanings_ja: ["偏見、先入観"]
    example_en: "The program aims to reduce prejudice against people from other countries."
    example_ja: "その取り組みは、外国から来た人々への偏見を減らすことを目指している。"
  - key: g2-v-willing
    headword: "willing"
    pos: adjective
    meanings_ja: ["（to do で）〜するのをいとわない、進んで〜する"]
    example_en: "Are you willing to help us clean the park this Saturday?"
    example_ja: "今週の土曜日、公園の掃除を手伝ってもらえますか。"
  - key: g2-v-exploit
    headword: "exploit"
    pos: verb
    meanings_ja: ["（人を）不当に利用する、搾取する", "（資源などを）開発する、活用する"]
    example_en: "The factory was criticized for exploiting young workers with very low pay."
    example_ja: "その工場は、若い労働者を低賃金で搾取していると批判された。"
  - key: g2-v-rhythm
    headword: "rhythm"
    pos: noun
    meanings_ja: ["リズム", "（生活などの）周期"]
    example_en: "The children clapped their hands to the rhythm of the music."
    example_ja: "子どもたちは音楽のリズムに合わせて手をたたいた。"
  - key: g2-v-honor
    headword: "honor"
    pos: verb
    meanings_ja: ["〜に敬意を表する、〜を称える", "（約束などを）守る"]
    example_en: "The town held a ceremony to honor the firefighters who saved many lives."
    example_ja: "町は、多くの命を救った消防士たちを称えるために式典を開いた。"
  - key: g2-v-prior-to
    headword: "prior to"
    pos: phrase
    meanings_ja: ["〜より前に、〜に先立って"]
    example_en: "Please arrive at the station at least ten minutes prior to departure."
    example_ja: "出発の少なくとも10分前には駅に着くようにしてください。"
  - key: g2-v-extinct
    headword: "extinct"
    pos: adjective
    meanings_ja: ["絶滅した", "（火山が）活動を停止した"]
    example_en: "Scientists believe dinosaurs became extinct about sixty-six million years ago."
    example_ja: "恐竜は約6600万年前に絶滅したと科学者たちは考えている。"
  - key: g2-v-in-case
    headword: "in case"
    pos: phrase
    meanings_ja: ["〜するといけないから、〜の場合に備えて"]
    example_en: "Take an umbrella with you in case it rains this afternoon."
    example_ja: "午後に雨が降るといけないから、傘を持っていきなさい。"
  - key: g2-v-react
    headword: "react"
    pos: verb
    meanings_ja: ["（〜に）反応する", "（化学的に）反応する"]
    example_en: "How did your parents react when you told them about your new job?"
    example_ja: "新しい仕事のことを話したとき、ご両親はどんな反応をしましたか。"
  - key: g2-v-discovery
    headword: "discovery"
    pos: noun
    meanings_ja: ["発見"]
    example_en: "The discovery of a new medicine gave hope to many patients."
    example_ja: "新薬が発見されたことで、多くの患者が希望を持った。"
  - key: g2-v-casual
    headword: "casual"
    pos: adjective
    meanings_ja: ["（服装などが）普段着の、カジュアルな", "気軽な、くだけた"]
    example_en: "Our office allows casual clothes on Fridays, so I wear jeans."
    example_ja: "会社では金曜日は普段着でよいので、私はジーンズをはいている。"
  - key: g2-v-salary
    headword: "salary"
    pos: noun
    meanings_ja: ["給料、給与"]
    example_en: "She got a higher salary after she moved to the new company."
    example_ja: "新しい会社に移ってから、彼女の給料は上がった。"
  - key: g2-v-bold
    headword: "bold"
    pos: adjective
    meanings_ja: ["大胆な、勇敢な", "（線・文字が）太い、目立つ"]
    example_en: "The new mayor made a bold decision to ban cars from the city center."
    example_ja: "新市長は、市の中心部への車の乗り入れを禁止するという大胆な決断をした。"
  - key: g2-v-moral
    headword: "moral"
    pos: adjective
    meanings_ja: ["道徳的な、道徳の"]
    example_en: "Teachers have a moral duty to treat all students fairly."
    example_ja: "教師には、すべての生徒を公平に扱う道徳的な義務がある。"
  - key: g2-v-finance
    headword: "finance"
    pos: noun
    meanings_ja: ["財政、財務", "（複数形で）財源、資金"]
    example_en: "My brother works in finance at a large bank in Osaka."
    example_ja: "兄は大阪の大手銀行で金融の仕事をしている。"
  - key: g2-v-necessarily
    headword: "necessarily"
    pos: adverb
    meanings_ja: ["（not と共に）必ずしも〜ない", "必然的に"]
    example_en: "Expensive restaurants do not necessarily serve the best food."
    example_ja: "高いレストランが必ずしも一番おいしい料理を出すとは限らない。"
  - key: g2-v-reply
    headword: "reply"
    pos: verb
    meanings_ja: ["（〜に）返事をする、答える"]
    example_en: "I sent her an email yesterday, but she has not replied yet."
    example_ja: "昨日彼女にメールを送ったが、まだ返事が来ていない。"
  - key: g2-v-tutor
    headword: "tutor"
    pos: verb
    meanings_ja: ["〜に個人指導をする、家庭教師をする"]
    example_en: "A college student tutors my brother in math twice a week."
    example_ja: "大学生が週に2回、弟に数学を教えてくれている。"
  - key: g2-v-manufacture
    headword: "manufacture"
    pos: verb
    meanings_ja: ["〜を製造する、生産する"]
    example_en: "This factory manufactures parts for cars and sends them all over the world."
    example_ja: "この工場は自動車の部品を製造し、世界中に出荷している。"
  - key: g2-v-vanish
    headword: "vanish"
    pos: verb
    meanings_ja: ["（突然）消える、見えなくなる", "消滅する"]
    example_en: "The cat vanished into the bushes as soon as it saw the dog."
    example_ja: "犬を見たとたん、その猫は茂みの中に姿を消した。"
  - key: g2-v-figure
    headword: "figure"
    pos: noun
    meanings_ja: ["数字、数値", "人物", "姿、形"]
    example_en: "According to the latest figures, the town's population is slowly falling."
    example_ja: "最新の数字によると、その町の人口は少しずつ減っている。"
  - key: g2-v-wildlife
    headword: "wildlife"
    pos: noun
    meanings_ja: ["野生生物"]
    example_en: "The national park protects the wildlife living in its forests and rivers."
    example_ja: "その国立公園は、森や川にすむ野生生物を保護している。"
  - key: g2-v-diverse
    headword: "diverse"
    pos: adjective
    meanings_ja: ["多様な、さまざまな"]
    example_en: "Students from diverse backgrounds attend this international school."
    example_ja: "このインターナショナルスクールには、さまざまな背景を持つ生徒が通っている。"
  - key: g2-v-leave-out
    headword: "leave out"
    pos: phrase
