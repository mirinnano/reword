# 2級 大問1: 語彙・熟語の空所補充（オリジナル問題）D〜H
grade: g2
type: g2-q1
items:
  - key: g2-q1-0201
    stem: After days of heavy rain, the governor ( ) a state of emergency and asked people to leave the area.
    choices: ["lifted", "rejected", "declared", "ignored"]
    answer: 2
    explanation_ja: "数日間の大雨の後、知事は非常事態を「宣言した」。declare a state of emergency で「非常事態を宣言する」。lift は「（非常事態などを）解除する」、reject は「拒否する」、ignore は「無視する」で、いずれも避難を求めた流れに合わない。"
    vocab: [g2-v-declare]
    difficulty: 2
  - key: g2-q1-0202
    stem: The politician continued to ( ) that he had accepted money from the company, but nobody believed him.
    choices: ["deny", "regret", "reveal", "realize"]
    answer: 0
    explanation_ja: "会社からお金を受け取ったことを「否定し」続けたが、誰も信じなかった。deny that ~ で「~ということを否定する」。regret は「後悔する」、reveal は「明らかにする」、realize は「気づく」で、いずれも「否定する」の意味にならない。"
    vocab: [g2-v-deny]
    difficulty: 2
  - key: g2-q1-0203
    stem: Emma practiced the piano for hours every day, so she really ( ) the first prize she won.
    choices: ["ignores", "loses", "neglects", "deserves"]
    answer: 3
    explanation_ja: "毎日何時間も練習したので、彼女が勝ち取った1等賞は本当に「受けるに値する」。deserve は「~に値する」。ignores は「無視する」、loses は「失う」、neglects は「なおざりにする」で、練習の努力と結びつく文意にならない。"
    vocab: [g2-v-deserve]
    difficulty: 2
  - key: g2-q1-0204
    stem: The doctor ( ) a small problem with my heart during a regular checkup, so I need more tests.
    choices: ["invented", "detected", "caused", "ignored"]
    answer: 1
    explanation_ja: "定期健診で医師が心臓の小さな異常を「見つけた」ので、さらに検査が必要だ。detect は「見つける、検出する」。invent は「発明する、でっち上げる」、cause は「引き起こす」、ignore は「無視する」で、いずれも「見つけた」の意味にならない。"
    vocab: [g2-v-detect]
    difficulty: 2
  - key: g2-q1-0205
    stem: Dr. Sato ( ) most of her career to finding a cure for the rare disease.
    choices: ["lost", "devoted", "wasted", "ignored"]
    answer: 1
    explanation_ja: "佐藤博士は経歴の大半をその珍しい病気の治療法を見つけることに「ささげた」。devote A to doing で「Aを~することにささげる」。lost は「失った」、wasted は「浪費した」、ignored は「無視した」で、治療法の探索にささげるという意味にならない。"
    vocab: [g2-v-devote]
    difficulty: 2
  - key: g2-q1-0206
    stem: After the earthquake, many companies ( ) money and supplies to help the people who had lost their homes.
    choices: ["wasted", "exchanged", "stole", "donated"]
    answer: 3
    explanation_ja: "地震の後、家を失った人々を助けるために多くの企業がお金や物資を「寄付した」。donate は「寄付する」。wasted は「無駄にした」、exchanged は「交換した」、stole は「盗んだ」で、人を助けるために差し出す意味にならない。"
    vocab: [g2-v-donate]
    difficulty: 1
  - key: g2-q1-0207
    stem: If you feel sick during the trip, please don't ( ) to tell one of the tour guides.
    choices: ["hesitate", "pretend", "deserve", "bother"]
    answer: 0
    explanation_ja: "旅行中に気分が悪くなったら「遠慮なく」ツアーガイドに伝えてほしい。don't hesitate to do で「ためらわずに~する」。pretend は「ふりをする」、deserve は「~に値する」、bother は「わざわざ~する」で、don't bother to は「伝える必要はない」となり依頼の文意と逆になる。"
    vocab: [g2-v-hesitate]
    difficulty: 1
  - key: g2-q1-0208
    stem: Please check all the doors and windows before you leave to ( ) that the building is safe.
    choices: [deny, complain, ensure, regret]
    answer: 2
    explanation_ja: 建物が安全であることを「確実にする」ため、帰る前にドアと窓をすべて確認してほしい。ensure that ~ で「~を確実にする」。deny は「否定する」、complain は「不平を言う」、regret は「後悔する」。
    vocab: [g2-v-ensure]
    difficulty: 2
  - key: g2-q1-0209
    stem: My uncle likes to ( ) when he tells stories, so the fish he caught gets bigger every time.
    choices: ["complain", "hesitate", "whisper", "exaggerate"]
    answer: 3
    explanation_ja: "話すたびに釣った魚が大きくなるのだから、おじは話を「大げさに言う」のが好きだ。exaggerate は「誇張する、大げさに言う」。complain は「不平を言う」、hesitate は「ためらう」、whisper は「ささやく」で、魚が大きくなる話とは結びつかない。"
    vocab: [g2-v-exaggerate]
    difficulty: 2
  - key: g2-q1-0210
    stem: The hotel became so busy that the owner ( ) three more workers to help in the kitchen.
    choices: ["hired", "fired", "praised", "thanked"]
    answer: 0
    explanation_ja: "ホテルがとても忙しくなったので、オーナーは厨房を手伝う従業員をさらに3人「雇った」。hire は「雇う」。fired は「解雇した」、praised は「ほめた」、thanked は「感謝した」で、手伝う人を増やす意味にならない。"
    vocab: [g2-v-hire]
    difficulty: 1
  - key: g2-q1-0211
    stem: The new staff member was not sure how to ( ) the angry customer, so she called her manager.
    choices: ["ignore", "deliver", "handle", "praise"]
    answer: 2
    explanation_ja: "怒った客にどう「対処すれば」よいかわからなかったので、店長を呼んだ。handle は「処理する、対処する」。ignore は「無視する」、deliver は「配達する」、praise は「ほめる」で、いずれも怒った客への対処の意味にならない。"
    vocab: [g2-v-handle]
    difficulty: 2
  - key: g2-q1-0212
    stem: The weather has been changing so quickly that nobody can ( ) it will be sunny on the day of the festival.
    choices: ["hope", "guarantee", "regret", "complain"]
    answer: 1
    explanation_ja: "天気がめまぐるしく変わっているので、祭りの当日に晴れると「保証する」ことは誰にもできない。guarantee (that) ~ で「~を保証する」。hope は「望む」、regret は「後悔する」、complain は「不平を言う」で、いずれも「晴れると言い切る」の意味にならない。"
    vocab: [g2-v-guarantee]
    difficulty: 2
  - key: g2-q1-0213
    stem: Because so many people wanted to see it, the museum ( ) the special exhibition for another two weeks.
    choices: ["extended", "closed", "shortened", "moved"]
    answer: 0
    explanation_ja: "見たい人がとても多かったので、博物館は特別展をさらに2週間「延長した」。extend は「延長する」。closed は「閉めた」、shortened は「短くした」、moved は「移した」で、さらに2週間延ばす流れに合わない。"
    vocab: [g2-v-extend]
    difficulty: 2
  - key: g2-q1-0214
    stem: Hawaii is a popular ( ) for Japanese couples who want to have their wedding abroad.
    choices: ["tradition", "souvenir", "custom", "destination"]
    answer: 3
    explanation_ja: "ハワイは海外で結婚式を挙げたい日本人カップルに人気の「行き先」だ。destination は「行き先」。tradition は「伝統」、souvenir は「土産」、custom は「習慣」で、いずれも結婚式を挙げる場所を表さない。"
    vocab: [g2-v-destination]
    difficulty: 1
  - key: g2-q1-0215
    stem: The company will pay for your travel ( ), including your hotel and train tickets, during the business trip.
    choices: ["stories", "guides", "expenses", "injuries"]
    answer: 2
    explanation_ja: "出張中のホテル代や電車の切符を含む旅行の「経費」は会社が支払う。travel expenses で「旅費、交通費」。story は「話、物語」、guide は「案内人、ガイドブック」、injury は「けが」で、いずれも旅費の意味にならない。"
    vocab: [g2-v-expense]
    difficulty: 2
  - key: g2-q1-0216
    stem: Every room in the hotel has a map that shows guests where to go in an ( ).
    choices: ["elevator", "emergency", "apartment", "outline"]
    answer: 1
    explanation_ja: "ホテルの各部屋には「緊急時」にどこへ行けばよいかを示す地図がある。in an emergency で「緊急時に」。elevator は「エレベーター」、apartment は「アパート」、outline は「概要」で、いずれも避難先を示す意味にならない。"
    vocab: [g2-v-emergency]
    difficulty: 1
  - key: g2-q1-0217
    stem: After losing his job, Mark could not pay back the money he had borrowed and soon fell into ( ).
    choices: ["debt", "silence", "error", "slumber"]
    answer: 0
    explanation_ja: "失業して借りたお金を返せず、まもなく「借金」を抱えた。fall into debt で「借金を抱える」。silence は「沈黙」、error は「誤り」、slumber は「まどろみ」で、いずれも金銭の状況を表さない。"
    vocab: [g2-v-debt]
    difficulty: 2
  - key: g2-q1-0218
    stem: Before going camping, we checked that we had all the necessary ( ), such as tents and sleeping bags.
    choices: ["furniture", "clothing", "equipment", "machinery"]
    answer: 2
    explanation_ja: "キャンプに行く前に、テントや寝袋など必要な「用具」がすべてそろっているか確認した。equipment は不可算名詞で「用具一式」の意味。furniture は「家具」、clothing は「衣類」、machinery は「機械類」で、テントや寝袋の範囲とずれる。"
    vocab: [g2-v-equipment]
    difficulty: 1
  - key: g2-q1-0219
    stem: Pandas are in danger because their natural ( ), the bamboo forests of China, is getting smaller.
    choices: ["harvest", "garden", "estate", "habitat"]
    answer: 3
    explanation_ja: "パンダの自然の「生息地」である中国の竹林が狭くなっているため、パンダは危機にある。habitat は「生息地」。harvest は「収穫」、garden は「庭」、estate は「地所」で、いずれも野生動物の生活の場を指さない。"
    vocab: [g2-v-habitat]
    difficulty: 2
  - key: g2-q1-0220
    stem: The most popular ( ) of the new car is that it can park itself without any help from the driver.
    choices: ["problem", "feature", "price", "color"]
    answer: 1
    explanation_ja: "新車で最も人気の「機能」は、運転手の助けなしに自動で駐車できることだ。feature は「特徴、（製品の）機能」。problem は「問題」、price は「価格」、color は「色」で、いずれも人気のある点の意味にならない。"
    vocab: [g2-v-feature]
    difficulty: 2
  - key: g2-q1-0221
    stem: The children were ( ) to open their presents, so they woke up very early on Christmas morning.
    choices: ["reluctant", "afraid", "unable", "eager"]
    answer: 3
    explanation_ja: "子どもたちはプレゼントを「早く開けたくてたまらなかった」ので、クリスマスの朝はとても早く起きた。be eager to do で「しきりに~したがる」。reluctant は「気が進まない」、afraid は「怖がる」、unable は「~できない」で、いずれも早起きの理由にならない。"
    vocab: [g2-v-eager]
    difficulty: 1
  - key: g2-q1-0222
    stem: The volunteers visit ( ) people who live alone to make sure they are healthy and not lonely.
    choices: ["elderly", "brave", "polite", "noisy"]
    answer: 0
    explanation_ja: "ボランティアは一人暮らしの「高齢の」人々を訪ね、元気で寂しくないかを確かめている。elderly は「年配の、高齢の」。brave は「勇敢な」、polite は「礼儀正しい」、noisy は「騒がしい」で、いずれも訪問の目的に合う人々の特徴ではない。"
    vocab: [g2-v-elderly]
    difficulty: 1
  - key: g2-q1-0223
    stem: Please wrap the glass vases carefully in paper because they are very ( ) and break easily.
    choices: ["heavy", "shiny", "fragile", "colorful"]
    answer: 2
    explanation_ja: "ガラスの花瓶はとても「壊れやすい」ので、紙で丁寧に包んでほしい。fragile は「壊れやすい」。heavy は「重い」、shiny は「光沢のある」、colorful は「色鮮やかな」で、いずれも壊れやすさの理由にはならない。"
    vocab: [g2-v-fragile]
    difficulty: 1
  - key: g2-q1-0224
    stem: Our neighbor is very ( ); she often shares the vegetables from her garden with everyone on our street.
    choices: ["shy", "generous", "noisy", "domestic"]
    answer: 1
    explanation_ja: "近所の人は庭の野菜を通りのみんなによく分けてくれるので、とても「気前がよい」。generous は「気前のよい」。shy は「内気な」、noisy は「騒がしい」、domestic は「国内の・家庭の」で、いずれも野菜を分ける人柄としては合わない。"
    vocab: [g2-v-generous]
    difficulty: 2
  - key: g2-q1-0225
    stem: Scientists warn that spending too much time looking at screens can be ( ) to children's eyes.
    choices: ["harmful", "useful", "visible", "familiar"]
    answer: 0
    explanation_ja: "画面を長時間見ることは子どもの目に「有害」になりうる。be harmful to ~ で「~に害を及ぼす」。useful は「役立つ」、visible は「目に見える」、familiar は「よく知られた」で、警告の文脈に合わない。"
    vocab: [g2-v-harmful]
    difficulty: 1
  - key: g2-q1-0226
    stem: The jewelry store was closed after police discovered that the diamonds it sold were not ( ) but cheap glass.
    choices: ["fresh", "polished", "solid", "genuine"]
    answer: 3
    explanation_ja: "売っていたダイヤモンドが「本物」ではなく安いガラスだとわかり、宝石店は閉店した。not A but B で「AではなくB」。genuine は「本物の」。fresh は「新鮮な」、polished は「磨かれた」、solid は「中身の詰まった、固い」で、いずれも安いガラスとの対比として成立しない。"
    vocab: [g2-v-genuine]
    difficulty: 2
  - key: g2-q1-0227
    stem: The train was delayed for more than two hours because of the typhoon, but it ( ) arrived in Osaka at midnight.
    choices: [hardly, eventually, rarely, recently]
    answer: 1
    explanation_ja: 台風で2時間以上遅れたが、列車は深夜に「ようやく」大阪に着いた。eventually は「最終的に、ついに」。hardly は「ほとんど~ない」、rarely は「めったに~ない」、recently は「最近」。
    vocab: [g2-v-eventually]
    difficulty: 2
  - key: g2-q1-0228
    stem: The music at the party was so loud that I could ( ) hear what my friend was saying.
    choices: [eventually, definitely, hardly, gradually]
    answer: 2
    explanation_ja: パーティーの音楽がうるさすぎて、友達の言っていることが「ほとんど」聞こえ「なかった」。hardly は否定の意味を含む。eventually は「最終的に」、definitely は「確かに」、gradually は「徐々に」。
    vocab: [g2-v-hardly]
    difficulty: 2
  - key: g2-q1-0229
    stem: Our apartment is too small, so we decided to ( ) the old sofa that nobody sits on anymore.
    choices: ["get rid of", "get along with", "put up with", "figure out"]
    answer: 0
    explanation_ja: "アパートが狭すぎるので、もう誰も座らない古いソファを「処分する」ことにした。get rid of は「処分する」。get along with は「仲良くやる」、put up with は「我慢する」、figure out は「理解する」で、いずれも狭い部屋からソファを手放す意味にならない。"
    vocab: [g2-v-get-rid-of]
    difficulty: 2
  - key: g2-q1-0230
    stem: The math problem was so difficult that nobody in the class could ( ) the answer before the bell rang.
    choices: ["pass on", "set up", "put off", "figure out"]
    answer: 3
    explanation_ja: "数学の問題がとても難しく、チャイムが鳴るまでに誰も答えを「見つけ出す」ことができなかった。figure out the answer で「答えを導き出す」。pass on は「（情報などを）伝える」、set up は「設置する、立ち上げる」、put off は「延期する」で、いずれも答えを導き出す意味にならない。"
    vocab: [g2-v-figure-out]
    difficulty: 2
