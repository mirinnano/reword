    explanation_ja: 台風で2時間以上遅れたが、列車は深夜に「ようやく」大阪に着いた。eventually は「最終的に、ついに」。hardly は「ほとんど~ない」、rarely は「めったに~ない」、recently は「最近」。
    vocab: [g2-v-eventually]
    difficulty: 2
  - key: g2-q1-0228
    stem: The music at the party was so loud that I could ( ) hear what my friend was saying.
    choices: [eventually, definitely, hardly, gradually]
    answer: 2
    explanation_ja: パーティーの音楽がうるさすぎて、友達の言っていることが「ほとんど」聞こえ「なかった」。hardly は否定の意味を含む。eventually は「最終的に」、definitely は「確かに」、gradually は「徐々に」。
    vocab: [g2-v-hardly]
    difficulty: 2
  - key: g2-q1-0229
    stem: Our apartment is too small, so we decided to ( ) the old sofa that nobody sits on anymore.
    choices: [get rid of, get along with, hand in, figure out]
    answer: 0
    explanation_ja: アパートが狭すぎるので、もう誰も座らない古いソファを「処分する」ことにした。get along with は「仲良くやる」、hand in は「提出する」、figure out は「理解する」。
    vocab: [g2-v-get-rid-of]
    difficulty: 2
  - key: g2-q1-0230
    stem: The math problem was so difficult that nobody in the class could ( ) the answer before the bell rang.
    choices: [get rid of, get along with, put off, figure out]
    answer: 3
    explanation_ja: 数学の問題がとても難しく、チャイムが鳴るまでに誰も答えを「見つけ出す」ことができなかった。figure out the answer で「答えを導き出す」。get rid of は「処分する」、get along with は「仲良くやる」、put off は「延期する」。
    vocab: [g2-v-figure-out]
    difficulty: 2
