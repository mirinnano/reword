# 2級 大問1: 語彙・熟語の空所補充（オリジナル問題）I〜O
grade: g2
type: g2-q1
items:
  - key: g2-q1-0301
    stem: The police are checking videos from security cameras to ( ) the person who stole the bicycle.
    choices: ["rescue", "offend", "identify", "forgive"]
    answer: 2
    explanation_ja: "防犯カメラの映像を確認して、自転車を盗んだ人物を「特定する」。identify は「特定する」。rescue は「救助する」、offend は「感情を害する」、forgive は「許す」で、映像確認の目的として合わない。"
    vocab: [g2-v-identify]
    difficulty: 1
  - key: g2-q1-0302
    stem: Although I said I could walk home, my aunt ( ) on driving me to the station.
    choices: ["insisted", "depended", "reflected", "commented"]
    answer: 0
    explanation_ja: "歩いて帰れると言ったのに、おばは駅まで車で送ると「言い張った」。insist on doing で「~すると言い張る」。depended は「頼った」、commented は「論評した」、reflected は「よく考えた」で、いずれも「~すると言い張る」の意味にならない。"
    vocab: [g2-v-insist]
    difficulty: 2
  - key: g2-q1-0303
    stem: The building manager plans to ( ) new security cameras at every entrance next month.
    choices: ["remove", "install", "repair", "justify"]
    answer: 1
    explanation_ja: "来月すべての入り口に新しい防犯カメラを「設置する」予定だ。install は「設置する」。remove は「取り外す」、repair は「修理する」、justify は「正当化する」で、新しい防犯カメラの設置とは結びつかない。"
    vocab: [g2-v-install]
    difficulty: 1
  - key: g2-q1-0304
    stem: It is rude to ( ) people while they are speaking, so please wait until they have finished.
    choices: ["introduce", "motivate", "greet", "interrupt"]
    answer: 3
    explanation_ja: "人が話している最中に「話をさえぎる」のは失礼なので、話し終えるまで待つべきだ。interrupt は「さえぎる」。introduce は「紹介する」、motivate は「やる気を起こさせる」、greet は「あいさつする」で、いずれも話をさえぎる意味にはならない。"
    vocab: [g2-v-interrupt]
    difficulty: 1
  - key: g2-q1-0305
    stem: The old house had been ( ) for many years, so the garden was full of weeds and the roof was broken.
    choices: [neglected, observed, inspired, launched]
    answer: 0
    explanation_ja: 庭が雑草だらけで屋根も壊れていたのは、その古い家が長年「放置されていた」から。neglect は「（世話をせず）放っておく」。observed は「観察された」、inspired は「刺激を受けた」、launched は「開始された」。
    vocab: [g2-v-neglect]
    difficulty: 2
  - key: g2-q1-0306
    stem: The union is trying to ( ) with the company for shorter working hours and higher pay.
    choices: ["compete", "quarrel", "negotiate", "volunteer"]
    answer: 2
    explanation_ja: "労働組合は労働時間の短縮と賃上げを求めて会社と「交渉し」ようとしている。negotiate with ~ で「~と交渉する」。compete は「競争する」、quarrel は「口論する」、volunteer は「自ら進んで引き受ける」で、いずれも要求を取り決める意味にならない。"
    vocab: [g2-v-negotiate]
    difficulty: 2
  - key: g2-q1-0307
    stem: The space agency plans to ( ) a new satellite next year to collect data about the weather.
    choices: ["destroy", "launch", "sell", "repair"]
    answer: 1
    explanation_ja: "宇宙機関は気象データを集めるため、来年新しい人工衛星を「打ち上げる」予定だ。launch は「打ち上げる」。destroy は「破壊する」、sell は「売る」、repair は「修理する」で、いずれも気象データを集める計画に合わない。"
    vocab: [g2-v-launch]
    difficulty: 1
  - key: g2-q1-0308
    stem: Kenta paid for my concert ticket last week, so I still ( ) him 5,000 yen.
    choices: ["lend", "show", "tell", "owe"]
    answer: 3
    explanation_ja: "健太にコンサートのチケット代を払ってもらったので、まだ5,000円を「借りている」。owe A B で「AにB（金額）を借りている」。lend は「貸す」（立場が逆になる）、show は「見せる」、tell は「伝える」で、いずれも金銭の借りを表さない。"
    vocab: [g2-v-owe]
    difficulty: 1
  - key: g2-q1-0309
    stem: Loud noise from the construction site next door ( ) with the students' concentration during the test.
    choices: [interfered, coped, agreed, dealt]
    answer: 0
    explanation_ja: 隣の工事現場の大きな音が、試験中の生徒の集中を「妨げた」。interfere with ~ で「~のじゃまをする」。coped は「対処した」、agreed は「同意した」、dealt は「扱った」で、騒音が主語では意味が通らない。
    vocab: [g2-v-interfere]
    difficulty: 2
  - key: g2-q1-0310
    stem: The mayor tried to ( ) the high cost of the new stadium by saying it would bring many tourists to the city.
    choices: ["interrupt", "reduce", "justify", "ignore"]
    answer: 2
    explanation_ja: "多くの観光客を呼び込むと言って、新しいスタジアムの高い建設費を「正当化し」ようとした。justify は「正当化する」。interrupt は「さえぎる」、reduce は「減らす」、ignore は「無視する」で、観光客を呼ぶという理由づけと結びつかない。"
    vocab: [g2-v-justify]
    difficulty: 2
  - key: g2-q1-0311
    stem: When she described the food as "interesting," she seemed to ( ) that she did not really like it.
    choices: ["regret", "forget", "doubt", "imply"]
    answer: 3
    explanation_ja: "料理を「興味深い」と表現したことで、本当は好きではないことを「ほのめかして」いるようだった。imply that ~ で「～ということをそれとなく示す」。regret は「後悔する」、forget は「忘れる」、doubt は「疑う」で、いずれも文意に合わない。"
    vocab: [g2-v-imply]
    difficulty: 3
  - key: g2-q1-0312
    stem: The earthquake ( ) early in the morning, while most people in the town were still asleep.
    choices: ["vanished", "occurred", "collapsed", "faded"]
    answer: 1
    explanation_ja: "地震は町の人々のほとんどがまだ寝ている早朝に「起こった」。occur は自動詞で「（出来事が）起こる」。vanished は「消えた」、collapsed は「崩れた」、faded は「薄れた」で、いずれも地震の起こり方としては文意に合わない。"
    vocab: [g2-v-occur]
    difficulty: 1
  - key: g2-q1-0313
    stem: The coach's kind words ( ) the players to practice even harder for the final game.
    choices: ["motivated", "forced", "ordered", "warned"]
    answer: 0
    explanation_ja: "コーチの優しい言葉が、選手たちに決勝戦に向けてさらに練習する「やる気を起こさせた」。motivate A to do で「Aに～する気にさせる」。forced は「無理やり～させた」、ordered は「命じた」、warned は「警告した」で、優しい言葉の働きとしては不自然。"
    vocab: [g2-v-motivate]
    difficulty: 2
  - key: g2-q1-0314
    stem: Fresh tomatoes are the most important ( ) in this pasta sauce, so please do not use canned ones.
    choices: ["spice", "seasoning", "ingredient", "occasion"]
    answer: 2
    explanation_ja: "新鮮なトマトがこのパスタソースで最も大切な「材料」なので、缶詰は使わないでほしい。spice は「香辛料」、seasoning は「調味料」、occasion は「場合・行事」で、いずれも材料の意味にはならない。"
    vocab: [g2-v-ingredient]
    difficulty: 1
  - key: g2-q1-0315
    stem: Not being able to speak the local language was the main ( ) she faced after moving abroad.
    choices: ["accent", "salary", "custom", "obstacle"]
    answer: 3
    explanation_ja: "現地の言葉を話せないことが、海外に移住して直面した主な「障害」だった。accent は「なまり」、salary は「給料」、custom は「習慣」で、いずれも直面した困難としては文意に合わない。"
    vocab: [g2-v-obstacle]
    difficulty: 2
  - key: g2-q1-0316
    stem: The ( ) of the students voted for the new school rule, so it was accepted easily.
    choices: ["minority", "majority", "audience", "crowd"]
    answer: 1
    explanation_ja: "生徒の「大多数」が新しい校則に賛成票を投じたので、すんなり採用された。the majority of ~ で「~の大部分」。minority は「少数派」、audience は「聴衆」、crowd は「群衆」で、少数派や聴衆の賛成ではすんなり採用された理由にならない。"
    vocab: [g2-v-majority]
    difficulty: 1
  - key: g2-q1-0317
    stem: The soccer player had to leave the field after he suffered a serious ( ) to his ankle.
    choices: ["injury", "concussion", "blister", "operation"]
    answer: 0
    explanation_ja: "サッカー選手は足首に重い「けが」を負ってピッチを去らなければならなかった。suffer an injury で「けがをする」。concussion は「脳しんとう」、blister は「まめ・水ぶくれ」、operation は「手術」で、足首の重いけがという文意に合わない。"
    vocab: [g2-v-injury]
    difficulty: 1
  - key: g2-q1-0318
    stem: My car is quite old, but I have no ( ) of selling it because it still runs very well.
    choices: ["chance", "hope", "intention", "outcome"]
    answer: 2
    explanation_ja: "車はかなり古いが、まだよく走るので売る「つもり」はない。have no intention of doing で「~するつもりはない」。chance は「可能性」、hope は「望み」、outcome は「結果」で、いずれも「つもりはない」の意味にはならない。"
    vocab: [g2-v-intention]
    difficulty: 2
  - key: g2-q1-0319
    stem: The school lunch menu is planned by experts in ( ) so that children can eat a healthy, balanced diet.
    choices: ["architecture", "laboratory", "astronomy", "nutrition"]
    answer: 3
    explanation_ja: "学校給食の献立は、子どもが健康でバランスのよい食事をとれるよう「栄養」の専門家が立てている。architecture は「建築（学）」、laboratory は「実験室」、astronomy は「天文学」で、栄養の献立とは結びつかない。"
    vocab: [g2-v-nutrition]
    difficulty: 2
  - key: g2-q1-0320
    stem: My grandmother uses her best plates only on special ( ), such as New Year's Day and birthdays.
    choices: ["guests", "occasions", "instructions", "tablecloths"]
    answer: 1
    explanation_ja: "祖母は元日や誕生日などの特別な「時」にだけ一番よい皿を使う。on special occasions で「特別な時に」。guests は「客」、instructions は「指示」、tablecloths は「テーブルクロス」で、皿を使う場面としては文意に合わない。"
    vocab: [g2-v-occasion]
    difficulty: 1
  - key: g2-q1-0321
    stem: It was ( ) that Ken was nervous, because his hands were shaking during his speech.
    choices: ["obvious", "innocent", "doubtful", "moderate"]
    answer: 0
    explanation_ja: "スピーチ中に手が震えていたので、ケンが緊張していたのは「明らか」だった。It is obvious that ~ で「~は明らかだ」。innocent は「無罪の」、doubtful は「疑わしい」、moderate は「適度な」。"
    vocab: [g2-v-obvious]
    difficulty: 1
  - key: g2-q1-0322
    stem: After looking at the new evidence, the court decided that the man was ( ) and let him go home.
    choices: ["mature", "intense", "innocent", "guilty"]
    answer: 2
    explanation_ja: "新しい証拠を検討した結果、裁判所はその男が「無罪」だと判断し帰宅を許した。innocent は「無罪の」。mature は「成熟した」、intense は「激しい」、guilty は「有罪の」で、帰宅を許す判断と矛盾する。"
    vocab: [g2-v-innocent]
    difficulty: 2
  - key: g2-q1-0323
    stem: Mika is very ( ) on photography and takes her camera with her everywhere she goes.
    choices: ["tough", "strict", "hard", "keen"]
    answer: 3
    explanation_ja: "ミカは写真に「熱心」で、どこへ行くにもカメラを持っていく。be keen on ~ で「~に夢中だ」。tough on ~ は「～に厳しい」、strict on ~ は「～に厳格な」、hard on ~ は「～につらく当たる」で、熱心さとは結びつかない。"
    vocab: [g2-v-keen]
    difficulty: 2
  - key: g2-q1-0324
    stem: Drinking a ( ) amount of coffee, such as one or two cups a day, is not harmful for most adults.
    choices: ["innocent", "moderate", "heavy", "keen"]
    answer: 1
    explanation_ja: "1日1、2杯程度の「適度な」量のコーヒーは、ほとんどの大人にとって害はない。a moderate amount of ~ で「適量の~」。innocent は「無罪の」（ここでは不自然）、heavy は「多量の」、keen は「熱心な」。"
    vocab: [g2-v-moderate]
    difficulty: 2
  - key: g2-q1-0325
    stem: After finding a job, my brother moved out of our house because he wanted to be ( ) of our parents.
    choices: ["independent", "aware", "proud", "fond"]
    answer: 0
    explanation_ja: "就職した兄は、親から「自立し」たくて家を出た。be independent of ~ で「~から自立している」。aware は「～に気づいている」、proud は「～を誇りに思う」、fond は「～が好きな」で、家を出る理由としては文意に合わない。"
    vocab: [g2-v-independent]
    difficulty: 2
  - key: g2-q1-0326
    stem: I usually go to work by train, but I ( ) take a taxi when it is raining very heavily.
    choices: [merely, precisely, occasionally, formerly]
    answer: 2
    explanation_ja: 普段は電車通勤だが、大雨のときは「時々」タクシーに乗る。usually と but の対比から、例外的な行動を表す語が入る。merely は「単に」、precisely は「正確に」、formerly は「以前は」。
    vocab: [g2-v-occasionally]
    difficulty: 2
  - key: g2-q1-0327
    stem: Please don't be angry with him, because he was ( ) trying to help even though he made a mistake.
    choices: [increasingly, rarely, firmly, merely]
    answer: 3
    explanation_ja: 失敗はしたが、彼は「単に」手伝おうとしていただけなので怒らないでほしい。merely は「ただ~にすぎない」。increasingly は「ますます」、rarely は「めったに~ない」、firmly は「しっかりと」。
    vocab: [g2-v-merely]
    difficulty: 3
  - key: g2-q1-0328
    stem: Mr. Sato is ( ) the new project, so please ask him if you have any questions about the schedule.
    choices: ["in charge of", "in need of", "in front of", "in search of"]
    answer: 0
    explanation_ja: "佐藤さんが新しいプロジェクトの「担当者」なので、日程について質問があれば彼に聞いてほしい。in charge of ~ で「~を担当して」。in need of は「～を必要として」、in front of は「~の前に」、in search of は「~を探して」で、いずれも担当の意味にはならない。"
    vocab: [g2-v-in-charge-of]
    difficulty: 1
  - key: g2-q1-0329
    stem: Tom walked so fast that his little sister could not ( ) him and soon started to cry.
    choices: ["put up with", "keep up with", "look down on", "look up to"]
    answer: 1
    explanation_ja: "トムがとても速く歩いたので、妹は「ついていけ」ずに泣き出した。keep up with ~ で「~に遅れずについていく」。put up with は「～に我慢する」、look down on は「～を見下す」、look up to は「～を尊敬する」で、いずれも歩く速さの文脈に合わない。"
    vocab: [g2-v-keep-up-with]
    difficulty: 2
  - key: g2-q1-0330
    stem: Everyone said the movie was wonderful, so I expected a lot, but it did not ( ) my expectations.
    choices: ["make up for", "run into", "live up to", "give in to"]
    answer: 2
    explanation_ja: "皆がすばらしいと言うので大いに期待したが、映画はその期待に「応える」ものではなかった。live up to one's expectations で「期待に応える」。make up for は「～を埋め合わせる」、run into は「～に偶然出会う」、give in to は「～に屈する」。"
    vocab: [g2-v-live-up-to]
    difficulty: 3
